name: Setup mise
description: Install the pinned mise binary and the tools it manages after verifying the binary digest

inputs:
  tools:
    required: false
    default: ""
    description: Space-separated mise tool specifications to install; empty installs nothing
  github-token:
    required: true
    description: Token used while mise resolves tools from GitHub

runs:
  using: composite
  steps:
    - name: Resolve mise paths
      id: paths
      shell: bash
      run: |
        echo "bin=${HOME}/.local/bin" >> "$GITHUB_OUTPUT"
        echo "binary=${HOME}/.local/bin/mise" >> "$GITHUB_OUTPUT"

    - name: Restore mise binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.binary }}
        key: mise-${{ runner.os }}-${{ runner.arch }}-2026.11.7-8f5426d9

    - name: Install and verify mise binary
      shell: bash
      env:
        MISE_VERSION: 2026.11.7
        MISE_SHA256: 8f5426d9971eaf713b37509749174ca69cf2f08b8b25e389168dcfcab9cd1a4d
        BIN_DIR: ${{ steps.paths.outputs.bin }}
        BINARY: ${{ steps.paths.outputs.binary }}
      run: | # zizmor: ignore[github-env] Both GITHUB_PATH entries derive only from the GitHub-hosted runner's HOME, never workflow input.
        set -euo pipefail

        verify() {
          [ -f "$BINARY" ] || return 1
          echo "${MISE_SHA256}  ${BINARY}" | sha256sum --check --status
        }

        if verify; then
          echo "cached mise matches the pinned digest"
        else
          if [ -f "$BINARY" ]; then
            echo "cached mise does not match the pinned digest; discarding it"
            rm -f "$BINARY"
          fi

          mkdir -p "$BIN_DIR"
          url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64"
          curl --fail --proto '=https' --proto-redir '=https' --location --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$BINARY" "$url"

          if ! verify; then
            echo "downloaded mise does not match the pinned digest (expected ${MISE_SHA256})"
            sha256sum "$BINARY" || true
            exit 1
          fi
          echo "downloaded mise matches the pinned digest"
        fi

        chmod +x "$BINARY"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "${HOME}/.local/share/mise/shims" >> "$GITHUB_PATH"

    - name: Install requested tools
      if: inputs.tools != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # 道具を mise.lock の取得元と照合値からだけ入れる。lock に無い道具と宣言と違う版は入れずに落ちる。
        # 版と取得元を GitHub の API に問い合わせないので、API の上限に当たらない（ADR-0503 決定2）。
        MISE_LOCKED: "1"
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail

        mise --version
        # shellcheck disable=SC2086
        mise install $TOOLS
