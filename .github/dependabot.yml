# `cooldown` withholds an update PR until the stated number of days has passed since the version
# was published. A security update skips it and opens immediately, which is Dependabot's own
# behaviour and not configurable here.
#
# cooldown の下限（取り込みの窓）は scripts/repo-settings/dependabot_cooldown.go が検査する（ADR-0501 決定17）。
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"

  # 上流のイメージで実行する Security の道具（docker-compose.yaml の image:）。
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker_compose"
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
