# `cooldown` withholds an update PR until the stated number of days has passed since the version
# was published. A security update skips it and opens immediately, which is Dependabot's own
# behaviour and not configurable here.
#
# 各 ecosystem の cooldown は、その更新を取り込むときに掛かる窓より短くしない。短いと、取り込めない PR が
# 先に開く（ADR-0501 決定17）。docker / docker-compose / github-actions は digest / SHA の固定を解決し直す窓
# （make pin-images-resolve / make pin-actions-resolve の既定）、gomod は make go-cooldown-gate の窓で、
# どちらも scripts/lib/cooldown の定数が持つ。make repo-settings-check が下回らないことを確かめる。
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"

  # 上流のイメージで実行する Security の道具（docker-compose.yaml の image:）。
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker_compose"
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
