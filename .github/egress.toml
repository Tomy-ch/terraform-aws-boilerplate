# 各 job の先頭にある bullfrog の allowed-domains / allowed-ips の SSOT。
# クラスの意味・書式・追加手順・反映と検査のコマンドは .github/workflows/README.md の「ランナーの封じ込め」節。

[class.base]
# hosted runner の一部では、egress proxy が /etc/resolv.conf の先頭の nameserver を
# 127.0.0.100 のローカル転送役へ書き換える（actions/runner-images#14925）。bullfrog は既定でこれを
# DNS サーバとして信用しないので、許さないと名前解決が止まる。転送先の問い合わせも bullfrog の
# DNS 判定を通るため、許すドメインは広がらない。外す条件は、runner の resolv.conf が 127.0.0.53
# だけを指すようになること。
ips = ["127.0.0.100"]
hosts = [
  "api.github.com",
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "raw.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "*.actions.githubusercontent.com",
  # 結果と cache の置き場（productionresultssa<N>.blob.core.windows.net）のうち、bullfrog の agent が
  # 既定で許すのは sa0〜sa19 だけである（bullfrogsec/agent の pkg/agent/types.go）。それより後の番号は、
  # GitHub が実際に割り当てたものだけを1つずつ足す。`*.blob.core.windows.net` や番号の範囲は、誰でも
  # 作れる Azure Storage のアカウントへの持ち出し口になる。
  "productionresultssa30.blob.core.windows.net",
  "productionresultssa31.blob.core.windows.net",
  "productionresultssa32.blob.core.windows.net",
]

[class.mise]
hosts = [
  "mise.jdx.dev",
  "mise-versions.jdx.dev",
  "mise.run",
  "mise.en.dev",
  "aquaproj.github.io",
  "proxy.golang.org",
  "sum.golang.org",
  "index.golang.org",
  "storage.googleapis.com",
  "dl.google.com",
  "go.dev",
  "golang.org",
  "nodejs.org",
  "registry.npmjs.org",
  "tuf-repo-cdn.sigstore.dev",
  "rekor.sigstore.dev",
  "fulcio.sigstore.dev",
  # GitHub Release を持たない aqua パッケージ（`type: http`）の配布元。cooldown は公開時刻を
  # ここが配布物へ付けた Last-Modified から取り、遮断されると窓を満たさないのではなく
  # **確認できない**として落ちる。
  "awscli.amazonaws.com",
]

[class.go]
# setup-mise の `tools: go` で Go だけを入れ、scripts/ の道具を go build する job。mise の他の backend は引かない。
hosts = [
  # mise が go の版の一覧を引く先。
  "mise-versions.jdx.dev",
  # mise の core の go が toolchain の配布物と checksum を取る先（go_download_mirror の既定）。
  "dl.google.com",
  # go build が module を取る先。go.sum が全件を持つので sum.golang.org は引かない。
  "proxy.golang.org",
]

[class.terraform]
includes = ["mise"]
hosts = [
  # provider と module の解決。ADR-0205 により module は取りに行かないが、
  # registry の discovery は provider の解決経路と同じ入口を通る。
  "registry.terraform.io",
  "releases.hashicorp.com",
  # provider のバイナリの実体。registry が指す先。
  "github-releases.githubusercontent.com",
]

[class.trivy]
includes = ["mise"]
hosts = [
  # 脆弱性 DB と checks バンドルは OCI artifact として配布される。取れないと trivy は
  # 「所見なし」ではなく FATAL で落ちる —— 検査が働かなかったことが緑に化けない。
  "mirror.gcr.io",
  "ghcr.io",
  "pkg-containers.githubusercontent.com",
]

[class.docker-hub]
# 上流のイメージで実行する Security の道具（ADR-0503 決定4）の pull。layer の実体は Cloudflare の R2 か
# S3 のどちらかから配られ、どちらになるかは要求ごとに変わる。この2つの Bucket のホストは Docker の許可
# リストの文書に載っておらず、CI で名前解決に失敗したときの名前である。`*.r2.cloudflarestorage.com` や
# `*.s3.amazonaws.com` は誰でも作れる Bucket への持ち出し口になるので、Docker Hub の Bucket のホストだけを
# 許す。ただし bullfrog は名前解決の結果の IP で判定するので（ADR-0702 の保証範囲）、正確な名前を書いても
# 実効の持ち出し口は狭まらない。
hosts = [
  "registry-1.docker.io",
  "auth.docker.io",
  "production.cloudfront.docker.com",
  "docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com",
  "docker-images-prod.s3.dualstack.us-east-1.amazonaws.com",
]

[class.deps-dev]
hosts = [
  "api.deps.dev",
]

[class.aws-state]
# OIDC で role を assume し、state の Bucket に触れる job（ADR-0602 決定12）。region は env/*/providers.tf の
# region に合わせる。
# S3 の Bucket の名前はアカウント ID を含み、公開の宣言に置けないので、virtual-hosted-style の endpoint を
# wildcard で許す。IP 判定のため正確な名前を書いても狭まらない点は docker-hub と同じ（ADR-0702 の保証範囲）。
# 外す条件は、Bucket を path-style で呼ぶか、bullfrog が名前そのもので判定するようになること。
hosts = [
  "sts.ap-northeast-1.amazonaws.com",
  "s3.ap-northeast-1.amazonaws.com",
  "*.s3.ap-northeast-1.amazonaws.com",
]

[class.aws]
# iam は global の endpoint だけを持つ。
# S3 Control の endpoint はアカウント ID を前に付けるので wildcard で許す。aws provider は Bucket の tag を
# S3 Control の ListTagsForResource で先に読み、権限が無いと返ったときだけ GetBucketTagging へ移る
# （internal/service/s3/tags.go）。名前解決で落ちると移らず、再試行が job の時間切れまで続く。
includes = ["aws-state"]
hosts = [
  "cloudformation.ap-northeast-1.amazonaws.com",
  "iam.amazonaws.com",
  "kms.ap-northeast-1.amazonaws.com",
  "organizations.us-east-1.amazonaws.com",
  "*.s3-control.ap-northeast-1.amazonaws.com",
  "ssm.ap-northeast-1.amazonaws.com",
]

# workload root の通知の構成物（ops-notification）の型の宛先。identity root の job には持たせない。
# us-east-1 は、us-east-1 にしか出ない metric の alarm の通知先を置く region（repository-wide/ADR-0208）。
[class.aws-notify]
includes = ["aws"]
hosts = [
  "sns.ap-northeast-1.amazonaws.com",
  "sns.us-east-1.amazonaws.com",
  "kms.us-east-1.amazonaws.com",
  "scheduler.ap-northeast-1.amazonaws.com",
  "scheduler.us-east-1.amazonaws.com",
  "chatbot.us-west-2.amazonaws.com",
]

# CI が Terraform を実行する root と、その root に触れるジョブ（scripts/README.md の egress/ の行）。
[root."env/admin/identity"]
jobs = ["terraform-gates.yaml:plan-admin-identity", "terraform-apply.yaml:apply-admin-identity", "terraform-unlock.yaml:unlock-admin-identity", "terraform-lock-hold.yaml:hold-admin-identity"]

[root."env/admin"]
jobs = ["terraform-gates.yaml:plan-admin-workload", "terraform-apply.yaml:apply-admin-workload", "terraform-unlock.yaml:unlock-admin-workload", "terraform-lock-hold.yaml:hold-admin-workload"]

# resource / data source の型が呼ぶ宛先。名前の形と当たり方は scripts/README.md の egress/ の行（make egress-check が拒む）。
# API を呼ばない型は、型名そのもので hosts を空にする。
[type.aws_chatbot_]
hosts = ["chatbot.us-west-2.amazonaws.com"]

[type.aws_caller_identity]
hosts = ["sts.ap-northeast-1.amazonaws.com"]

[type.aws_cloudformation_]
hosts = ["cloudformation.ap-northeast-1.amazonaws.com"]

[type.aws_iam_]
hosts = ["iam.amazonaws.com"]

[type.aws_kms_]
hosts = ["kms.ap-northeast-1.amazonaws.com", "kms.us-east-1.amazonaws.com"]

# Organizations は global の endpoint だけを持ち、商用の partition では us-east-1 に在る。
[type.aws_organizations_]
hosts = ["organizations.us-east-1.amazonaws.com"]

[type.aws_partition]
hosts = []

[type.aws_region]
hosts = []

[type.aws_s3_]
hosts = [
  "s3.ap-northeast-1.amazonaws.com",
  "*.s3.ap-northeast-1.amazonaws.com",
  "*.s3-control.ap-northeast-1.amazonaws.com",
]

[type.aws_scheduler_]
hosts = ["scheduler.ap-northeast-1.amazonaws.com", "scheduler.us-east-1.amazonaws.com"]

[type.aws_ssm_]
hosts = ["ssm.ap-northeast-1.amazonaws.com"]

[type.aws_sns_]
hosts = ["sns.ap-northeast-1.amazonaws.com", "sns.us-east-1.amazonaws.com"]

[job."api-budget.yaml:api-budget"]
classes = []

[job."actions-lint.yaml:actions-lint"]
