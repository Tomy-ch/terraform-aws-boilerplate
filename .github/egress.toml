# 各 job の先頭にある bullfrog の allowed-domains / allowed-ips の SSOT。
# クラスの意味・書式・追加手順・反映と検査のコマンドは .github/workflows/README.md の「ランナーの封じ込め」節。

[class.base]
# hosted runner の一部では、egress proxy が /etc/resolv.conf の先頭の nameserver を
# 127.0.0.100 のローカル転送役へ書き換える（actions/runner-images#14925）。bullfrog は既定でこれを
# DNS サーバとして信用しないので、許さないと名前解決が止まる。転送先の問い合わせも bullfrog の
# DNS 判定を通るため、許すドメインは広がらない。外す条件は、runner の resolv.conf が 127.0.0.53
# だけを指すようになること。
ips = ["127.0.0.100"]
hosts = [
  "api.github.com",
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "raw.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "*.actions.githubusercontent.com",
  # 結果と cache の置き場（productionresultssa<N>.blob.core.windows.net）のうち、bullfrog の agent が
  # 既定で許すのは sa0〜sa19 だけである（bullfrogsec/agent の pkg/agent/types.go）。それより後の番号は、
  # GitHub が実際に割り当てたものだけを1つずつ足す。`*.blob.core.windows.net` や番号の範囲は、誰でも
  # 作れる Azure Storage のアカウントへの持ち出し口になる。
  "productionresultssa30.blob.core.windows.net",
  "productionresultssa31.blob.core.windows.net",
  "productionresultssa32.blob.core.windows.net",
]

[class.mise]
hosts = [
  "mise.jdx.dev",
  "mise-versions.jdx.dev",
  "mise.run",
  "mise.en.dev",
  "aquaproj.github.io",
  "proxy.golang.org",
  "sum.golang.org",
  "index.golang.org",
  "storage.googleapis.com",
  "dl.google.com",
  "go.dev",
  "golang.org",
  "nodejs.org",
  "registry.npmjs.org",
  "tuf-repo-cdn.sigstore.dev",
  "rekor.sigstore.dev",
  "fulcio.sigstore.dev",
  # aube（mise 内蔵の npm インストーラ）が依存解決時に問い合わせる supply-chain 情報源。遮断すると解決自体が失敗する
  "api.npmjs.org",
  "api.osv.dev",
  "npm.jsr.io",
  # GitHub Release を持たない aqua パッケージ（`type: http`）の配布元。cooldown は公開時刻を
  # ここが配布物へ付けた Last-Modified から取り、遮断されると窓を満たさないのではなく
  # **確認できない**として落ちる。
  "awscli.amazonaws.com",
]

[class.terraform]
includes = ["mise"]
hosts = [
  # provider と module の解決。ADR-0205 により module は取りに行かないが、
  # registry の discovery は provider の解決経路と同じ入口を通る。
  "registry.terraform.io",
  "releases.hashicorp.com",
  # provider のバイナリの実体。registry が指す先。
  "github-releases.githubusercontent.com",
]

[class.trivy]
includes = ["mise"]
hosts = [
  # 脆弱性 DB と checks バンドルは OCI artifact として配布される。取れないと trivy は
  # 「所見なし」ではなく FATAL で落ちる —— 検査が働かなかったことが緑に化けない。
  "mirror.gcr.io",
  "ghcr.io",
  "pkg-containers.githubusercontent.com",
]

[class.docker-hub]
# 上流のイメージで実行する Security の道具（ADR-0503 決定4）の pull。layer の実体は Cloudflare の R2 から
# 配られる。`*.r2.cloudflarestorage.com` は誰でも作れるバケットへの持ち出し口になるので、Docker Hub の
# バケットのホストだけを許す。
hosts = [
  "registry-1.docker.io",
  "auth.docker.io",
  "production.cloudfront.docker.com",
  "docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com",
]

[class.deps-dev]
# パッケージの供給網の情報（deps.dev）。依存の評価をする job が引く。
hosts = [
  "api.deps.dev",
]

[job."actions-lint.yaml:actions-lint"]
classes = ["mise"]

[job."commitlint.yaml:commitlint"]
classes = ["mise"]

# sample:begin
[job."dependency-review.yaml:dependency-review"]
classes = ["deps-dev"]
# OpenSSF Scorecard の要約（show-openssf-scorecard は既定で有効）が引くデータ源。
# 呼ぶのは「その PR が新しく足した依存」がある時だけなので、依存を増やさない PR では
# 一度も出ていかない。そのため、この宛先と deps-dev が欠けていても依存を足す PR が現れるまで
# 誰も気づかず、現れた瞬間にその PR だけが fetch failed で落ちる。
extra = [
  "api.securityscorecards.dev",
]
# sample:end

