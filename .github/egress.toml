[job."go-test.yaml:changes"]
classes = []

[job."go-test.yaml:go-test"]
classes = ["mise"]

[job."go-test.yaml:test-mapping"]
classes = ["mise"]

[job."md-lint.yaml:md-lint"]
classes = ["mise"]

[job."md-lint.yaml:adr-lint"]
classes = ["mise"]

[job."md-lint.yaml:skill-lint"]
classes = ["mise"]

[job."notify.yaml:notify"]
classes = []
