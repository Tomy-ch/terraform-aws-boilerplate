# mise.toml などが宣言するツールと provider の供給網 cooldown を緊急に外すための lockfile（SSOT）。
# make tool-cooldown-gate / tool-cooldown-audit と .github/workflows/tool-cooldown.yaml が読む。
#
# 1 行 1 エントリ。形式は以下で、3 つのキーは順序も含めてすべて必須。
# key は mise.toml に書かれたキーそのもの（短縮名なら短縮名のまま）。provider は
# `terraform-registry:registry.terraform.io/<namespace>/<type>`。
#
#   "<key>@<version>" = { expires = YYYY-MM-DD, issue = <N>, reason = "..." }
#
# expires は必ず置く。期限切れ・上限（今日から 3 ヶ月）超過・どの宣言にも無いエントリは、
# audit で失敗する。gate は、変更が触れた宣言に掛かるエントリと、変更が足すか書き換えた
# エントリのときだけ失敗する（理由: ADR-0702 決定18、ADR-0603 決定11）。解決したらエントリを消す。
