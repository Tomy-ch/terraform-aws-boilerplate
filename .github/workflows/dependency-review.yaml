name: Dependency Review

# Blocks a PR before merge when it introduces a dependency with a known vulnerability. Scoped to
# the files that can change the dependency graph: the Go module under `scripts/` and the GitHub
# Actions referenced by `uses:` under `.github/`.
# Why the trigger condition lives in a job: README.md の「必須検査はすべての Pull Request で報告される」.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The action diffs the base ref against the head ref, so it only has the
    # required context on a pull request. Skip it on workflow_dispatch instead
    # of letting the run fail.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # Required by comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            api.deps.dev
            api.securityscorecards.dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # License policy is intentionally left at the action default: this
      # repository declares no allow / deny license list, so no allow-licenses /
      # deny-licenses input is set here.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Trivy (trivy-fs) already reports MEDIUM and above, and govulncheck
          # reports every vulnerability the scripts/ code can reach.
          # This workflow is a merge blocker, so it is narrowed to HIGH and
          # above to keep the block signal actionable.
          fail-on-severity: high
          # GHSA-fc5q-39xc-vjpf: picomatch（markdownlint-cli2 が globby を通して使う、docker/tools/node の
          # lockfile の推移的な依存）の ReDoS。攻撃には glob のパターンを渡せることが要るが、glob は
          # リポジトリの Makefile と設定が持ち、それを書き換えられる者は既に CI でコードを実行できる。
          # 修正版はまだ無い（4.0.7 以下がすべて該当）。
          # 撤回: 修正版が出たら pnpm -C docker/tools/node update --lockfile-only picomatch で上げ、この行を外す。
          allow-ghsas: GHSA-fc5q-39xc-vjpf
          comment-summary-in-pr: always
