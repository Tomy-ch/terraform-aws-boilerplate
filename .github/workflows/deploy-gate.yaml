name: Deploy Gate

# デプロイブランチへ入る Pull Request の検査（ADR-0603 決定31）と、その env の plan。どれも ruleset が直接 required とする
# context で、reusable workflow の中に置くと caller の名前が前に付くので、native の job として置く。

on:
  # edited は base の付け替えを含む。deploy-source-check の判定は base に依るので、付け替えで走り直す。
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # デプロイブランチへ入る Pull Request の head を検査する（ADR-0603 決定31）。デプロイブランチ宛でなければ
  # 対象外として成功する。検査のコードと宣言は base の commit のものを使い、Pull Request に書き換えさせない。
  deploy-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: scripts/go.mod
          cache: true
          cache-dependency-path: scripts/go.sum

      - name: Check the source of the deploy branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: make deploy-source-check RUNNER_MODE=host

