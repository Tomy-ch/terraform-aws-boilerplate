        id: refuse-untrusted
        env:
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.repository_id }}
          ACTOR: ${{ github.actor }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test "$HEAD_REPO_ID" = "$REPO_ID" || { echo "❌ fork からの Pull Request では plan の role を assume しません"; exit 1; }
          test "$ACTOR" != "dependabot[bot]" || { echo "❌ Dependabot の Pull Request では plan の role を assume しません"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "❌ environment admin-plan の secret AWS_ACCOUNT_ID がありません"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-local は scripts/ からビルドする。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest aqua:aws/aws-cli go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the plan role
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-aws-credentials CI_ENV=admin CI_ROLE=plan RUNNER_MODE=host

      - name: Confirm the apply-family roles refuse this job
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-assume-denied CI_ENV=admin RUNNER_MODE=host

      - name: Plan the workload root
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CI_PR: ${{ github.event.pull_request.number }}
        run: make ci-plan-admin-workload RUNNER_MODE=host

  call-trivy-release-gate:
    if: ${{ contains(fromJSON('["admin", "security", "log-archive", "production", "staging", "develop"]'), github.base_ref) }} # branch-set: deploy
    uses: ./.github/workflows/trivy-release-gate.yaml
    permissions:
      contents: read
      pull-requests: write
