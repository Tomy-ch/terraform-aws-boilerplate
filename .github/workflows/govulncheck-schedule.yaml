name: Go Vulnerability Scan (schedule)

# govulncheck.yaml の定期実行と、その通知。検査の中身は govulncheck.yaml が持つ。

on:
  schedule:
    - cron: '15 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/govulncheck.yaml
    permissions:
      contents: read
      pull-requests: write

  # 報告のみの job なので、検出の通知はスケジュール実行だけが出す。理由は README.md の「通知の起動条件」。
  notify-detection:
    needs: scan
    if: ${{ github.event_name == 'schedule' && needs.scan.outputs.count != '' && needs.scan.outputs.count != '0' }}
    uses: ./.github/workflows/notify.yaml
    with:
      detected: govulncheck found ${{ needs.scan.outputs.count }} reachable vulnerabilities
      details: ${{ needs.scan.outputs.detail }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}

  # 理由は README.md の「通知の起動条件」。
  notify-failure:
    needs: scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: govulncheck
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}
