name: Markdown Lint

# `make md-lint` is wired into the lefthook pre-commit hook only, so `--no-verify` and edits
# made through the GitHub web UI reach a merge unchecked. Every stage runs here.
#
# CI ではコンテナを起こさない。markdownlint-cli2 は mise が npm backend で解決する道具であり、
# CI の実行環境へ直接用意して `RUNNER_MODE=host` で呼ぶ。道具の版は手元と同じ mise.toml が決める。
#
# `paths` フィルタは置かない。Markdown の検査はリポジトリ中の `.md` をすべて読むため、
# フィルタが名指しできる対象が無い。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443
            awscli.amazonaws.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: node npm:markdownlint-cli2
          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Run Markdown lint
        id: md-lint
        shell: bash
        run: |
          set +e

          make md-lint RUNNER_MODE=host 2>&1 | tee /tmp/md-lint.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Markdown lint: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Markdown lint: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The checkout must be as clean as it was before the lint, or a later reader cannot tell a
      # real drift from this job's own leftovers. `scripts/node_modules` is ignored, so anything
      # reported here is something this job put in a tracked path.
      - name: Verify the working tree is clean
        run: git status --porcelain --untracked-files=all | tee /tmp/md-lint-dirty.log && test ! -s /tmp/md-lint-dirty.log

      - name: Comment Markdown lint result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- md-lint-result -->'
          status: ${{ steps.md-lint.outputs.status }}
          title: "${{ steps.md-lint.outputs.title || '## ⚠️ Markdown Lint: CUT OFF (no result produced)' }}"
          body-file: /tmp/md-lint.log
          details-summary: 'md-lint log'

      - name: Fail if Markdown lint failed
        if: always() && steps.md-lint.outputs.status != 'success'
        run: exit 1
