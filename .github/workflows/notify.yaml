name: Notify

# 通知の再利用 workflow。モードは3つで、どれを使うかは呼び出し側が入力で選ぶ。
# 起動条件の理由は README.md の「通知の起動条件」が持つ。
#
#   失敗（`failed-job`）—— スケジュールや push で走る job が壊れた。
#   検出（`detected` + `details`）—— 意図して build を落とさない走査が何かを見つけた。
#   成功（`succeeded-job` + `details`）—— deploy の job が終わった。
#
# 宛先の系統は `slack-webhook-url` に渡す secret が選ぶ（secrets の説明を参照）。どの job がどの secret を
# 渡すかは .github/notify-channels.toml が宣言し、make notify-channel-lint が突き合わせる。
#
# このリポジトリの workflow_call はこれだけで、ほかの共有は .github/actions/ の composite action
# である。composite action は走査の job の step として走るので、webhook が、脆弱な依存やコンテナの
# イメージを展開したばかりのランナーに載る。workflow_call は常に自分のランナーを持つので、webhook と
# 同じ機械に載るのは、contents: read だけを持ちリポジトリを checkout しないこのファイルだけになる。
#
# ファイルは2つに分かれる。
#
#   1. "Build notification payload" とそれより上は配送の手段に依らない。何が起きたか、どこを見るか
#      だけを決める。
#   2. "Resolve notification backend" と "Send to Slack" は Slack に依る。workflow_call の
#      `slack-webhook-url` の名前も同じ。
#
# Slack を別の手段に替えるときは、その3箇所と、呼び出し側の `secrets:` の行だけを変え、1 には
# 触らない。この境界を保つこと。
#
# 失敗のモードは走査の出力を運ばない。指すのは run の URL だけなので、secret や脆弱性の詳細が
# 通知の宛先へ届くことはない。検出と成功のモードは `details` を運ぶ。何を見つけたか、何を適用したかを
# 言えない通知は、報告している出来事を特定できないからである。何を渡してよいかは
# `inputs.details` の説明が持つ。

on:
  workflow_call:
    inputs:
      failed-job:
        description: >-
          失敗した job の名前（呼び出し側の workflow に書かれたもの）。失敗のモードを選ぶ。
          `detected`・`succeeded-job` とは同時に渡さない。
        required: false
        type: string
        default: ''
      detected:
        description: >-
          検出したものの1行の説明（例: "DevSkim found 2 findings"）。検出のモードを選ぶ。
          `failed-job`・`succeeded-job` とは同時に渡さない。
        required: false
        type: string
        default: ''
      details:
        description: >-
          検出のモードでは検出したものを1行に1つ名指す Markdown、成功のモードでは適用した件数の行。
          識別子と件数だけを渡し、一致した secret の値や terraform の出力は渡さない。
        required: false
        type: string
        default: ''
      succeeded-job:
        description: >-
          成功した job の名前（呼び出し側の workflow に書かれたもの）。成功のモードを選ぶ。
          `failed-job`・`detected` とは同時に渡さない。
        required: false
        type: string
        default: ''
    secrets:
      slack-webhook-url:
        description: >-
          Slack の Incoming Webhook の URL。URL ごとに宛先のチャンネルが決まるので、呼び出し側が
          渡す secret が系統を選ぶ。未設定なら配信を省き、run を緑のままにする。webhook が無いのは
          準備の不足であって走査の結果ではなく、報告するはずだった出来事を覆い隠してはならない。
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            hooks.slack.com

      # 再利用 workflow の github の文脈は呼び出し側のものなので、下の
      # workflow の名前・起動・実行者・run id は、このファイルではなく呼び出した workflow を指す。
      #
      # モードの違いは見出しと項目の一覧だけで、この step より後は共通である。検出のモードが実行者と
      # commit も持つのは、誰がどのブランチに何を持ち込んだかを名指すことがその目的だからである。
      # 成功のモードが commit を持つのは、どの commit が適用されたかが deploy の記録の要点だからである。
      - name: Build notification payload
        id: payload
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER: ${{ github.event_name }}
          FAILED_JOB: ${{ inputs.failed-job }}
          DETECTED: ${{ inputs.detected }}
          DETAILS: ${{ inputs.details }}
          SUCCEEDED_JOB: ${{ inputs.succeeded-job }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # 既定のモードを選ばずに落とす。黙って1つを選ぶと、起きたことを取り違えた通知が送られ、
          # それは通知が無いより悪い。
          modes=0
          for v in "${FAILED_JOB}" "${DETECTED}" "${SUCCEEDED_JOB}"; do
            if [ -n "${v}" ]; then
              modes=$((modes + 1))
            fi
          done
          if [ "${modes}" -ne 1 ]; then
            echo "::error::notify.yaml は failed-job・detected・succeeded-job のうちちょうど1つを受けます（${modes} 個が渡されました）。"
            exit 1
          fi

          if [ -n "${FAILED_JOB}" ]; then
            headline="🚨 ${WORKFLOW_NAME} failed"
            headline_md="🚨 *${WORKFLOW_NAME}* failed"
            fields=$(jq -n \
              --arg repo "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg trigger "${TRIGGER}" \
              --arg job "${FAILED_JOB}" \
              '[["Repository", $repo], ["Ref", $ref], ["Trigger", $trigger], ["Failed job", $job]]')
          elif [ -n "${SUCCEEDED_JOB}" ]; then
            headline="✅ ${WORKFLOW_NAME} succeeded"
            headline_md="✅ *${WORKFLOW_NAME}* succeeded"
            fields=$(jq -n \
              --arg repo "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg commit "${COMMIT}" \
              --arg trigger "${TRIGGER}" \
              --arg job "${SUCCEEDED_JOB}" \
              '[["Repository", $repo], ["Ref", $ref], ["Commit", $commit], ["Trigger", $trigger], ["Succeeded job", $job]]')
          else
            headline="⚠️ ${DETECTED}"
            headline_md="⚠️ *${DETECTED}*"
            fields=$(jq -n \
              --arg repo "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg commit "${COMMIT}" \
              --arg actor "${ACTOR}" \
              --arg trigger "${TRIGGER}" \
              --arg at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              '[["Repository", $repo], ["Ref", $ref], ["Commit", $commit], ["Actor", $actor], ["Trigger", $trigger], ["Detected at", $at]]')
          fi

          # JSON は jq で組み、引用符や改行を含む値が payload を壊せないようにする。Slack は
          # 3000 文字を超える text object を拒むので、details はそれより十分短く切る。全文は run が持つ。
          jq -n \
            --arg headline "${headline}" \
            --arg headline_md "${headline_md}" \
            --argjson fields "${fields}" \
            --arg details "${DETAILS}" \
            --arg repo "${REPOSITORY}" \
            --arg ref "${REF_NAME}" \
            --arg url "${RUN_URL}" \
            '
            def truncate: if (. | length) > 2500 then .[0:2500] + "\n… (truncated, see the run)" else . end;
            {
              text: "\($headline) — \($repo) (\($ref))",
              blocks: (
                [{
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ($headline_md + "\n" + ($fields | map("*\(.[0]):* \(.[1])") | join("\n")))
                  }
                }]
                + (if $details == "" then [] else [{
                    type: "section",
                    text: { type: "mrkdwn", text: ($details | truncate) }
                  }] end)
                + [{
                    type: "section",
                    text: { type: "mrkdwn", text: "<\($url)|View run logs>" }
                  }]
              )
            }' > notification.json

          {
            echo "## ${headline}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "${fields}" | jq -r '.[] | "| \(.[0]) | \(.[1]) |"'
            echo "| Run | ${RUN_URL} |"
            if [ -n "${DETAILS}" ]; then
              echo
              echo "${DETAILS}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      # 送る step と分け、secret を `if:` の式へ渡さずに「宛先は在るか」に答える。
      - name: Resolve notification backend
        id: backend
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${WORKFLOW_NAME} が secret slack-webhook-url へ渡した値が空なので、配信を省きます。どの secret を渡すかは .github/workflows/README.md の「通知の起動条件」が持ちます。"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "> 通知は配信していません: \`${WORKFLOW_NAME}\` が secret \`slack-webhook-url\` へ渡した値が空です。" >> "${GITHUB_STEP_SUMMARY}"
          fi
        shell: bash

      # Slack に依る（冒頭「ファイルは2つに分かれる」の 2）。
      - name: Send to Slack
        if: ${{ steps.backend.outputs.configured == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
        run: |
          set -euo pipefail
          # --fail-with-body は Slack が拒んだ理由を出す。
          # URL は引数ではなく `--config -` で渡す。プロセスの引数は curl が生きている間、ランナーの
          # /proc から読める。webhook はここで唯一の secret なので、argv から外す。
          printf 'url = "%s"\n' "${SLACK_WEBHOOK_URL}" | curl --config - \
            --fail-with-body -sS \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @notification.json
        shell: bash
