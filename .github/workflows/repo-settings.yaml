name: Repo Settings

# 保護設定（ruleset と environment）の宣言の整合と、宣言と実態の突合（ADR-0603 決定4-6）。
#
# repo-settings-check は宣言どうしの整合を見る。required で、すべての Pull Request で報告する
# —— Why the trigger condition lives in a job: README.md の「必須検査はすべての Pull Request で報告される」.
#
# repo-settings-drift は GitHub の実態を読み、宣言と突き合わせる。実態はリポジトリの変更なしに
# 変わるので、Pull Request とは独立に毎日走らせる（ADR-0603 検証方法の定期実行）。ruleset の
# bypass_actors は突合の対象外として出力する（理由は .github/settings/README.md）。

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  # 手動の起動が毎日の突合を cancel すると、notify-failure が cancelled を拾って誤って通知する。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-settings-check:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/go.mod
          cache: true
          cache-dependency-path: scripts/go.sum

      - name: Check the settings declarations
        id: check
        shell: bash
        run: |
          set +e

          make repo-settings-check RUNNER_MODE=host 2>&1 | tee /tmp/repo-settings-check.log

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Repo settings: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Repo settings: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment repo-settings result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- repo-settings-result -->'
          status: ${{ steps.check.outputs.status }}
          title: "${{ steps.check.outputs.title || '## ⚠️ Repo Settings Check: CUT OFF (no result produced)' }}"
          body-file: /tmp/repo-settings-check.log
          details-summary: 'repo-settings log'

      - name: Fail if the declarations disagree
        if: always() && steps.check.outputs.status != 'success'
        run: exit 1

  repo-settings-drift:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/go.mod
          cache: true
          cache-dependency-path: scripts/go.sum

      - name: Reconcile the declarations with GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make repo-settings-drift RUNNER_MODE=host

  # See README.md の「通知の起動条件」.
  notify-failure:
    needs: repo-settings-drift
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.repo-settings-drift.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: repo-settings-drift
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
