name: OpenSSF Scorecard

# 供給網の衛生の週次報告。何も止めない。結果は code scanning へ送るだけで、外部へ公開しない（ADR-0501 決定6）。
#
# Scorecard の push / schedule は既定ブランチだけを評価する。既定ブランチは線のどれかである
# 前提で、push は線（branches.json の lines）に限り、job の if: で既定ブランチに絞る。
#
# private なリポジトリで GitHub Advanced Security が無い場合、SARIF を code scanning へ送れない。
# その派生リポジトリはこの workflow と、.github/egress.toml の `scorecard.yaml:scorecard` を
# 同じ変更で削除する（片方だけだと make egress-check が落ちる）。

on:
  push:
    branches: # branch-set: lines
      - 'release/**'
      - 'hotfix/**'
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            api.deps.dev
            api.osv.dev
            www.bestpractices.dev
            oss-fuzz-build-logs.storage.googleapis.com
      - name: Harden the runner (retry)
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            api.deps.dev
            api.osv.dev
            www.bestpractices.dev
            oss-fuzz-build-logs.storage.googleapis.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:ossf/scorecard
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Scorecard
        shell: bash
        env:
          ENABLE_SARIF: '1'
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scorecard --repo="github.com/${REPO}" --format=sarif --show-details \
            --policy=.github/scorecard-policy.yml > scorecard.sarif

      - name: Upload Scorecard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard
          path: scorecard.sarif
          if-no-files-found: ignore

      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # See README.md の「通知の起動条件」.
  notify-failure:
    needs: scorecard
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scorecard.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: scorecard
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}
