name: Secret Scan (schedule)

# secret-scan.yaml の定期実行と、その通知。検査の中身は secret-scan.yaml が持つ。
#
# job ごとの通知は、呼んだ workflow が出力する job の status で見分ける。出力が空のとき（その job が status を
# 書く前に終わった）は、呼んだ job 全体の result で代える。

on:
  schedule:
    - cron: '45 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/secret-scan.yaml
    permissions:
      contents: read
      pull-requests: write

  # See README.md の「通知の起動条件」.
  notify-failure:
    needs: scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scan.outputs.secret-scan-status || needs.scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: secret-scan
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}

  notify-failure-trufflehog:
    needs: scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scan.outputs.trufflehog-status || needs.scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: trufflehog
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}
