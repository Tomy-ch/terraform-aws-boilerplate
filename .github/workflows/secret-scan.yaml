name: Secret Scan

on:
  pull_request:
  schedule:
    - cron: '45 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      # Full history on every trigger: the pull_request scan walks origin/<base>..HEAD, and a
      # shallow clone leaves the base unresolvable (secret-scan then fails with exit 2 rather
      # than scanning zero commits).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:gitleaks/gitleaks
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gitleaks
        id: gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          # pull_request: scan the commits the PR adds (origin/<base>..HEAD). schedule /
          # workflow_dispatch: scan the entire commit history, so secrets that were committed
          # and later deleted are still detected after merge (ADR-0302 決定6・8).
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            make secret-scan RUNNER_MODE=host 2>&1 | tee /tmp/gitleaks.log
          else
            make secret-scan-history RUNNER_MODE=host 2>&1 | tee /tmp/gitleaks.log
          fi

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (gitleaks)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: FAIL (gitleaks)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment secret scan result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- secret-scan-result -->'
          status: ${{ steps.gitleaks.outputs.status }}
          title: "${{ steps.gitleaks.outputs.title || '## ⚠️ Secret Scan: CUT OFF (no result produced)' }}"
          body-file: /tmp/gitleaks.log
          details-summary: 'gitleaks log'

      - name: Fail if gitleaks failed
        if: always() && steps.gitleaks.outputs.status != 'success'
        run: exit 1

  # Trivy's secret scanner over the working tree, as a separate job so its verdict,
  # comment and artifact never mix with the history scanners'. The overlap with
  # gitleaks and trufflehog is deliberate (ADR-0302 決定2).
  trivy-secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy secret scan (JSON)
        run: make -s trivy-secret RUNNER_MODE=host TRIVY_FORMAT=json > trivy-secret.json
        shell: bash

      - name: Create Trivy secret summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # Findings live under .Results[].Secrets; a file with none carries no Secrets
          # key, and Results itself is absent rather than empty when nothing was
          # scanned at all — hence the // [] defaults on both.
          COUNT=$(jq '
            [(.Results // [])[] | .Secrets // []]
            | flatten
            | length
          ' trivy-secret.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Secret scan: PASS (trivy)" >> "$GITHUB_OUTPUT"
            echo "No secret detected." > trivy-secret-summary.md
            exit 0
          fi

          echo "title=## 🚨 Secret scan: FOUND (${COUNT}) (trivy)" >> "$GITHUB_OUTPUT"

          # Rule id, title, file and line only. Trivy redacts the matched value in its
          # own output, but a comment on a pull request is a public surface and there
          # is no version of it that should carry a candidate secret at all — not even
          # a redacted one, whose length and shape are themselves information.
          jq -r '
            (.Results // [])[]
            | .Target as $target
            | (.Secrets // [])[]
            | "- [\(.Severity)] `\($target):\(.StartLine)` \(.RuleID) — \(.Title)"
          ' trivy-secret.json > trivy-secret-summary.md
        shell: bash

      - name: Upload Trivy secret report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-secret
          path: |
            trivy-secret.json
            trivy-secret-summary.md

      - name: Comment Trivy secret result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-secret-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Secret scan (trivy): CUT OFF (no result produced)' }}"
          body-file: trivy-secret-summary.md
          details-summary: '📄 Summary'

      # No severity threshold: a secret has no "minor" band. Accepted detections are
      # pinned per path in .trivyignore.yaml, so the baseline this gates on is zero.
      - name: Fail if a secret was found
        if: always() && steps.summarize.outputs.count != '0'
        run: exit 1

  # trufflehog over the same commit range / history as gitleaks (ADR-0302 決定2・6).
  #
  # The repository is public, so the job log, artifact and comment are public surfaces.
  # trufflehog's JSON carries candidate values in Raw / RawV2 / Redacted / ExtraData; it is
  # written only to the runner's temp dir, and nothing downstream carries more than the
  # detector name, path, line and short commit.
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:trufflesecurity/trufflehog
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the range guard of the secret scans
        run: make secret-gates-test RUNNER_MODE=host

      - name: Run trufflehog
        id: trufflehog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            target=trufflehog-scan
          else
            target=trufflehog-history
          fi
          make -s "$target" RUNNER_MODE=host TRUFFLEHOG_FORMAT=json \
            > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.err"
          code=$?
          set -e

          # stderr is trufflehog's JSON log, whose error fields carry detector error strings that
          # nobody has shown to be free of matched text. Only the level and message reach the log.
          jq -rR 'fromjson? | select(.level? // "" | startswith("error")) | "\(.level) \(.msg)"' \
            "$RUNNER_TEMP/trufflehog.err"

          jq -rR 'fromjson? | select(.DetectorName)
            | .SourceMetadata.Data.Git as $g
            | "- [\(.DetectorName)] \($g.file):\($g.line) (commit \($g.commit[0:8]))"' \
            "$RUNNER_TEMP/trufflehog.json" > trufflehog-summary.md
          count=$(grep -c . trufflehog-summary.md || true)

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && [ "$count" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (trufflehog)" >> "$GITHUB_OUTPUT"
            echo "No secret detected." > trufflehog-summary.md
          elif [ "$count" -gt 0 ]; then
            echo "status=findings" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 Secret scan: FOUND (${count}) (trufflehog)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: ERROR (trufflehog exited ${code} with no finding)" >> "$GITHUB_OUTPUT"
            echo "trufflehog did not complete; see the job log." > trufflehog-summary.md
          fi

      - name: Upload trufflehog summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trufflehog
          path: trufflehog-summary.md
          if-no-files-found: ignore

      - name: Comment trufflehog result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trufflehog-result -->'
          status: ${{ steps.trufflehog.outputs.status }}
          title: "${{ steps.trufflehog.outputs.title || '## ⚠️ Secret scan (trufflehog): CUT OFF (no result produced)' }}"
          body-file: trufflehog-summary.md
          details-summary: 'trufflehog summary'

      - name: Fail if trufflehog did not pass
        if: always() && steps.trufflehog.outputs.status != 'success'
        run: exit 1

  # See README.md の「通知の起動条件」.
  notify-failure:
    needs: secret-scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.secret-scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: secret-scan
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure-trivy-secret:
    needs: trivy-secret
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.trivy-secret.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: trivy-secret
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure-trufflehog:
    needs: trufflehog
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.trufflehog.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: trufflehog
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
