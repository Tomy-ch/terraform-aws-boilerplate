name: Secret Scan

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      called:
        description: workflow_call で呼ばれたこと。呼ばれたときは、走らせるかどうかを呼んだ側が決めます。
        type: boolean
        default: true
    outputs:
      secret-scan-status:
        description: job secret-scan の status（success・failure・cancelled）。走らなければ空。
        value: ${{ jobs.secret-scan.outputs.status }}
      trufflehog-status:
        description: job trufflehog の status（success・failure・cancelled）。走らなければ空。
        value: ${{ jobs.trufflehog.outputs.status }}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ inputs.called && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      # Full history on every trigger: the pull_request scan walks origin/<base>..HEAD, and a
      # shallow clone leaves the base unresolvable (secret-scan then fails with exit 2 rather
      # than scanning zero commits).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: go aqua:gitleaks/gitleaks
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gitleaks
        id: gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            make secret-scan RUNNER_MODE=host 2>&1 | tee /tmp/gitleaks.log
          else
            make secret-scan-history RUNNER_MODE=host 2>&1 | tee /tmp/gitleaks.log
          fi

          code=${PIPESTATUS[0]}

          if [ "$code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (gitleaks)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: FAIL (gitleaks)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Runs on every trigger: renaming a file orphans its path suppression.
      - name: Lint secret-scan suppressions
        run: make secret-suppression-lint RUNNER_MODE=host

      - name: Comment secret scan result on PR
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- secret-scan-status -->'
          status: ${{ steps.gitleaks.outputs.status }}
          title: "${{ steps.gitleaks.outputs.title || '## ⚠️ Secret Scan: CUT OFF (no result produced)' }}"
          body-file: /tmp/gitleaks.log
          details-summary: 'gitleaks log'

      - name: Fail if gitleaks failed
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && steps.gitleaks.outputs.status != 'success'
        run: exit 1

      # The workflow that calls this one on a schedule reads this to tell which job to report.
      - name: Report the job status
        id: status
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        env:
          STATUS: ${{ job.status }}
        run: echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  # The repository is public, so the job log, artifact and comment are public surfaces.
  # trufflehog's JSON carries candidate values in Raw / RawV2 / Redacted / ExtraData; it is
  # written only to the runner's temp dir, and nothing downstream carries more than the
  # detector name, path, line and short commit.
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: go aqua:trufflesecurity/trufflehog
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run trufflehog
        id: trufflehog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            target=trufflehog-scan
          else
            target=trufflehog-history
          fi
          make -s "$target" RUNNER_MODE=host TRUFFLEHOG_FORMAT=json \
            > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.err"
          code=$?
          set -e

          # stderr is trufflehog's JSON log, whose error fields carry detector error strings that
          # nobody has shown to be free of matched text. Only the level and message reach the log.
          # secret-scan's own verdict lines (non-JSON, starting with ❌ or ✅) are printed as they are;
          # its canary dumps (the --- blocks) are not.
          jq -rR 'fromjson? | select(.level? // "" | startswith("error")) | "\(.level) \(.msg)"' \
            "$RUNNER_TEMP/trufflehog.err"
          grep -E '^(❌|✅) ' "$RUNNER_TEMP/trufflehog.err" || true

          jq -rR 'fromjson? | select(.DetectorName)
            | .SourceMetadata.Data.Git as $g
            | "- [\(.DetectorName)] \($g.file):\($g.line) (commit \($g.commit[0:8]))"' \
            "$RUNNER_TEMP/trufflehog.json" > trufflehog-summary.md
          count=$(grep -c . trufflehog-summary.md || true)

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && [ "$count" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS (trufflehog)" >> "$GITHUB_OUTPUT"
            echo "No secret detected." > trufflehog-summary.md
          elif [ "$count" -gt 0 ]; then
            echo "status=findings" >> "$GITHUB_OUTPUT"
            echo "title=## 🚨 Secret scan: FOUND (${count}) (trufflehog)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: ERROR (trufflehog exited ${code} with no finding)" >> "$GITHUB_OUTPUT"
            echo "trufflehog did not complete; see the job log." > trufflehog-summary.md
          fi

      - name: Upload trufflehog summary
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trufflehog
          path: trufflehog-summary.md
          if-no-files-found: ignore

      - name: Comment trufflehog result on PR
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trufflehog-status -->'
          status: ${{ steps.trufflehog.outputs.status }}
          title: "${{ steps.trufflehog.outputs.title || '## ⚠️ Secret scan (trufflehog): CUT OFF (no result produced)' }}"
          body-file: trufflehog-summary.md
          details-summary: 'trufflehog summary'

      - name: Fail if trufflehog did not pass
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && steps.trufflehog.outputs.status != 'success'
        run: exit 1

      # The workflow that calls this one on a schedule reads this to tell which job to report.
      - name: Report the job status
        id: status
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        env:
          STATUS: ${{ job.status }}
        run: echo "status=$STATUS" >> "$GITHUB_OUTPUT"
