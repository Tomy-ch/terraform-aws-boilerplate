name: Terraform Apply

# 管理アカウントのデプロイブランチへの merge の後に、管理アカウントの identity root と workload root を、この順に
# CI が apply する。規則は README.md の「apply の job」。apply の手順の定義は .makefiles/terraform/operation/ci.mk だけが持つ。

on:
  push:
    branches:
      - admin

permissions:
  contents: read

# 実行中の apply は止めない。理由は README.md の「apply の job」。
concurrency:
  group: terraform-apply-admin
  cancel-in-progress: false

jobs:
  # terraform-gates.yaml の infra-code-gate と同じ検出をこの workflow にも置く。
  # path で絞らない: README.md の「インフラ内コードの検出への依存」.
  apply-infra-code-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate, hcl-input and hcl-tally are built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect infrastructure code
        run: make -k infra-code-gate RUNNER_MODE=host

  # terraform-gates.yaml の tf-lint が Pull Request で走らせる順序の検査を、apply する木にも掛ける。
  # 規則は README.md の「apply の job」.
  apply-resource-order-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate, tf-local, hcl-input and hcl-tally are built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the resource order
        run: make -k resource-order-check RUNNER_MODE=host

  # terraform-gates.yaml の tf-lint が Pull Request で走らせる層の検査を、apply する木にも掛ける。
  # 規則は README.md の「apply の job」.
  apply-layer-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate と tf-local と hcl-input と hcl-tally と provider-schema を scripts/ からビルドする。terraform: 層の検査が lock した AWS Provider の
      # schema を取る（ADR-0102 決定18 の分類の網羅）。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the layer rules
        run: make -k layer-check RUNNER_MODE=host

  # terraform-gates.yaml の tf-lint が Pull Request で走らせる root の構成と backend 設定の検査を、apply する木にも掛ける。
  # 規則は README.md の「apply の job」.
  apply-root-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate, tf-local, hcl-input and hcl-tally are built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the root composition and backend settings
        run: make -k root-check RUNNER_MODE=host

  # 管理アカウントの identity root の apply。規則は README.md の「apply の job」.
  apply-admin-identity:
    needs: [apply-infra-code-gate, apply-resource-order-check, apply-layer-check, apply-root-check]
    if: ${{ needs.apply-infra-code-gate.result == 'success' && needs.apply-resource-order-check.result == 'success' && needs.apply-layer-check.result == 'success' && needs.apply-root-check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: admin-apply-identity
    permissions:
      contents: read
      id-token: write
    # 成功の通知が運ぶ plan の件数の1行。terraform の出力は含まない（README.md の「通知の起動条件」）。
    # failure と apply-outcome は revert の判定が読む（README.md の「apply の失敗の revert」）。
    outputs:
      plan: ${{ steps.apply.outputs.plan }}
      failure: ${{ steps.apply.outputs.failure }}
      apply-outcome: ${{ steps.apply.outcome }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com
            sts.ap-northeast-1.amazonaws.com
            s3.ap-northeast-1.amazonaws.com
            *.s3.ap-northeast-1.amazonaws.com
            iam.amazonaws.com
            kms.ap-northeast-1.amazonaws.com
            organizations.us-east-1.amazonaws.com
            *.s3-control.ap-northeast-1.amazonaws.com

      # 再実行は元の run の commit と payload を使うので、古い run を止める。skip は成功として数えられる
      # ので失敗にする（ADR-0603 決定17）。どのブランチから起動できるかは environment が限る。
      - name: Refuse stale commits
        id: refuse-stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/$REF" --jq .object.sha)
          test "$SHA" = "$head" || { echo "❌ $SHA は $REF の先頭（$head）ではないので apply しません"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "❌ environment admin-apply-identity の secret AWS_ACCOUNT_ID がありません"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-local is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest aqua:aws/aws-cli go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the apply-identity role
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-aws-credentials CI_ENV=admin CI_ROLE=apply-identity RUNNER_MODE=host

      - name: Apply the identity root
        id: apply
        run: make ci-apply-admin-identity RUNNER_MODE=host

  # identity root の apply が apply の role の権限と permissions boundary を書き、この job がそれを使う。
  apply-admin-workload:
    needs: [apply-infra-code-gate, apply-resource-order-check, apply-layer-check, apply-root-check, apply-admin-identity]
    if: ${{ needs.apply-infra-code-gate.result == 'success' && needs.apply-resource-order-check.result == 'success' && needs.apply-layer-check.result == 'success' && needs.apply-root-check.result == 'success' && needs.apply-admin-identity.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: admin-apply
    permissions:
      contents: read
      id-token: write
    # plan・failure・apply-outcome の意味は apply-admin-identity の outputs と同じ。
    outputs:
      plan: ${{ steps.apply.outputs.plan }}
      failure: ${{ steps.apply.outputs.failure }}
      apply-outcome: ${{ steps.apply.outcome }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com
            sts.ap-northeast-1.amazonaws.com
            s3.ap-northeast-1.amazonaws.com
            *.s3.ap-northeast-1.amazonaws.com
            iam.amazonaws.com
            kms.ap-northeast-1.amazonaws.com
            organizations.us-east-1.amazonaws.com
            *.s3-control.ap-northeast-1.amazonaws.com
            sns.ap-northeast-1.amazonaws.com
            sns.us-east-1.amazonaws.com
            kms.us-east-1.amazonaws.com
            scheduler.ap-northeast-1.amazonaws.com
            scheduler.us-east-1.amazonaws.com
            chatbot.us-west-2.amazonaws.com

      # 古い run を止める理由は apply-admin-identity の Refuse stale commits と同じ。
      - name: Refuse stale commits
        id: refuse-stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/$REF" --jq .object.sha)
          test "$SHA" = "$head" || { echo "❌ $SHA は $REF の先頭（$head）ではないので apply しません"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "❌ environment admin-apply の secret AWS_ACCOUNT_ID がありません"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-local is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest aqua:aws/aws-cli go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the apply role
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-aws-credentials CI_ENV=admin CI_ROLE=apply RUNNER_MODE=host

      - name: Apply the workload root
        id: apply
        run: make ci-apply-admin-workload RUNNER_MODE=host

  # apply の失敗を戻す revert のブランチを用意するかと、その範囲を決める。規則は README.md の「apply の失敗の revert」。
  revert-plan:
    needs: [apply-admin-identity, apply-admin-workload]
    if: ${{ always() && (needs.apply-admin-identity.result == 'failure' || needs.apply-admin-workload.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      headline: ${{ steps.plan.outputs.headline }}
      summary: ${{ steps.plan.outputs.summary }}
      commits: ${{ steps.plan.outputs.commits }}
      branch: ${{ steps.plan.outputs.branch }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # go: apply-revert is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide the revert
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_REVERT_WORKFLOW: terraform-apply.yaml
          APPLY_REVERT_RESULTS: >-
            apply-admin-identity=${{ needs.apply-admin-identity.result }}:${{ needs.apply-admin-identity.outputs.apply-outcome }}:${{ needs.apply-admin-identity.outputs.failure }}
            apply-admin-workload=${{ needs.apply-admin-workload.result }}:${{ needs.apply-admin-workload.outputs.apply-outcome }}:${{ needs.apply-admin-workload.outputs.failure }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: make ci-revert-plan RUNNER_MODE=host

  # revert-plan が決めた範囲を revert して push する。規則は README.md の「apply の失敗の revert」。
  revert-push:
    needs: [revert-plan]
    if: ${{ needs.revert-plan.outputs.decision == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push the revert branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVERT_HEAD: ${{ needs.revert-plan.outputs.head }}
          REVERT_COMMITS: ${{ needs.revert-plan.outputs.commits }}
          REVERT_BRANCH: ${{ needs.revert-plan.outputs.branch }}
        run: make ci-revert-push RUNNER_MODE=host

  notify-failure:
    needs: [apply-infra-code-gate, apply-resource-order-check, apply-layer-check, apply-root-check, apply-admin-identity, apply-admin-workload]
    if: ${{ always() && (contains(fromJSON('["failure", "cancelled"]'), needs.apply-infra-code-gate.result) || contains(fromJSON('["failure", "cancelled"]'), needs.apply-resource-order-check.result) || contains(fromJSON('["failure", "cancelled"]'), needs.apply-layer-check.result) || contains(fromJSON('["failure", "cancelled"]'), needs.apply-root-check.result) || contains(fromJSON('["failure", "cancelled"]'), needs.apply-admin-identity.result) || contains(fromJSON('["failure", "cancelled"]'), needs.apply-admin-workload.result)) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.apply-admin-workload.result) && 'apply-admin-workload' || (needs.apply-admin-identity.result != 'skipped' && 'apply-admin-identity' || (needs.apply-infra-code-gate.result != 'success' && 'apply-infra-code-gate' || (needs.apply-resource-order-check.result != 'success' && 'apply-resource-order-check' || (needs.apply-layer-check.result != 'success' && 'apply-layer-check' || 'apply-root-check')))) }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_CRITICAL }}

  # revert の結果を、失敗の通知とは別に届ける。理由は README.md の「apply の失敗の revert」。
  notify-revert:
    needs: [revert-plan, revert-push]
    if: ${{ always() && needs.revert-plan.result != 'skipped' && needs.revert-plan.outputs.decision != 'skip' }}
    uses: ./.github/workflows/notify.yaml
    with:
      detected: ${{ needs.revert-plan.outputs.decision == 'push' && needs.revert-push.result != 'success' && 'apply の失敗を戻す revert のブランチを push できませんでした' || needs.revert-plan.outputs.headline || 'apply の失敗を戻す revert の判定が失敗しました' }}
      details: ${{ (needs.revert-plan.outputs.decision != 'push' || needs.revert-push.result == 'success') && needs.revert-plan.outputs.summary || '' }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_CRITICAL }}

  notify-success-admin-identity:
    needs: [apply-admin-identity]
    if: ${{ needs.apply-admin-identity.result == 'success' }}
    uses: ./.github/workflows/notify.yaml
    with:
      succeeded-job: apply-admin-identity
      details: ${{ needs.apply-admin-identity.outputs.plan }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_CRITICAL }}

  notify-success-admin-workload:
    needs: [apply-admin-workload]
    if: ${{ needs.apply-admin-workload.result == 'success' }}
    uses: ./.github/workflows/notify.yaml
    with:
      succeeded-job: apply-admin-workload
      details: ${{ needs.apply-admin-workload.outputs.plan }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY_CRITICAL }}
