name: Terraform Gates

# 同じ make を .lefthook.yaml の pre-commit も呼ぶ。検査の定義は .makefiles/terraform/ だけが持つ。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md の「必須検査はすべての Pull Request で報告される」.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net

      # fetch-depth: 0 so the PR's base and head commits are present locally for the filter's
      # `git diff`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token selects `git diff` over the compare API, which refuses a large diff.
          token: ''
          # scripts/: tf-lint runs tool-cooldown-check, which is built from these sources.
          filters: |
            relevant:
              - '.github/workflows/terraform-gates.yaml'
              - '.github/actions/setup-mise/**'
              - 'usecases/**'
              - 'modules/**'
              - 'env/**'
              - '**/.terraform.lock.hcl'
              - '.tflint.hcl'
              - 'mise.toml'
              - '.makefiles/**'
              - 'Makefile'
              - 'scripts/tool-cooldown/**'
              - 'scripts/lib/**'
              - 'scripts/go.mod'
              - 'scripts/go.sum'
              - 'conftest/plan/**'

  tf-fmt-check:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Terraform formatting
        run: make tf-fmt-check RUNNER_MODE=host

  tf-lint:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-lint runs tool-cooldown-check first, which is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:terraform-linters/tflint go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN: `tflint --init` fetches the ruleset through the GitHub Releases API, which
      # rate-limits unauthenticated calls.
      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make tf-lint RUNNER_MODE=host

  tf-validate-test:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -k: a validate failure still reports the test results; either failure fails the step.
      # No secret reaches this step: init runs whatever provider the PR's configuration resolves.
      - name: Run terraform validate and terraform test
        run: make -k tf-validate tf-test RUNNER_MODE=host

  tf-policy:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The canary runs first: a gate that cannot fail says nothing about the reference roots.
      # No secret reaches this step: the plan runs under mock_provider without credentials.
      - name: Run the Policy Test
        run: make tf-policy-canary tf-policy RUNNER_MODE=host

  tf-gates-test:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: the tf-lint cases run tool-cooldown-check, which is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the Terraform gates' own tests
        run: make tf-gates-test RUNNER_MODE=host

  # No path filter: the declaration, the Rego, the ADRs and the code-owner declaration all change the verdict.
  # Why: README.md の「必須検査はすべての Pull Request で報告される」.
  infra-code-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the infrastructure-code gate's own tests
        run: make infra-code-gate-test RUNNER_MODE=host

      - name: Detect infrastructure code
        run: make infra-code-gate RUNNER_MODE=host

  # 管理アカウントの identity root の plan（ADR-0602 決定13-14、ADR-0601 決定9）。path で skip しない。
  # 全文は plan の出力の Bucket に置き、公開されるログには要約だけを出す（.makefiles/terraform/operation/ci.mk）。
  plan-admin-identity:
    needs: infra-code-gate
    if: ${{ needs.infra-code-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: admin-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            api.npmjs.org
            api.osv.dev
            npm.jsr.io
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com
            sts.ap-northeast-1.amazonaws.com
            iam.amazonaws.com
            s3.ap-northeast-1.amazonaws.com
            *.s3.ap-northeast-1.amazonaws.com

      # skip ではなく失敗にする（ADR-0602 決定14）。fork と Dependabot の run は secret を受けない。
      - name: Refuse untrusted Pull Requests
        id: refuse-untrusted
        env:
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.repository_id }}
          ACTOR: ${{ github.actor }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test "$HEAD_REPO_ID" = "$REPO_ID" || { echo "❌ fork からの Pull Request では plan の role を assume しません"; exit 1; }
          test "$ACTOR" != "dependabot[bot]" || { echo "❌ Dependabot の Pull Request では plan の role を assume しません"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "❌ environment admin-plan の secret AWS_ACCOUNT_ID がありません"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-local is built from scripts/.
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest aqua:aws/aws-cli go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the plan role
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-aws-credentials CI_ENV=admin CI_ROLE=plan RUNNER_MODE=host

      - name: Plan the identity root
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CI_PR: ${{ github.event.pull_request.number }}
        run: make ci-plan-admin-identity RUNNER_MODE=host
