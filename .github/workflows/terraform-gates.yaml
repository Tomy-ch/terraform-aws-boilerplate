name: Terraform Gates

# 同じ make を .lefthook.yaml の pre-commit も呼ぶ。検査の定義は .makefiles/terraform/ だけが持つ。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Why the trigger condition lives in a job: README.md の「必須検査はすべての Pull Request で報告される」.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net

      # fetch-depth: 0 は、フィルタの `git diff` が PR の base と head の commit を手元で読むため。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # 空の token で、大きな diff を拒む compare API ではなく `git diff` を使わせる。
          token: ''
          # scripts/: tf-lint が tool-cooldown-check を、順序の検査と層の検査と Policy Test が infra-code-gate と tf-local を、
          # 順序の検査と層の検査と root の検査が hcl-input と hcl-tally を、層の検査と Policy Test が provider-schema を、Terraform の各段が tf-gates を走らせ、
          # どれもこのソースからビルドする。
          filters: |
            relevant:
              - '.github/workflows/terraform-gates.yaml'
              - '.github/actions/setup-mise/**'
              - 'usecases/**'
              - 'modules/**'
              - 'env/**'
              - '**/.terraform.lock.hcl'
              - '.tflint.hcl'
              - '.tf-validate-ignore.yaml'
              - 'mise.toml'
              - '.makefiles/**'
              - 'Makefile'
              - 'scripts/tool-cooldown/**'
              - 'scripts/infra-code-gate/**'
              - 'scripts/tf-local/**'
              - 'scripts/bootstrap-check/**'
              - 'scripts/hcl-input/**'
              - 'scripts/hcl-tally/**'
              - 'scripts/provider-schema/**'
              - 'scripts/tf-policy/**'
              - 'scripts/tf-gates/**'
              - 'scripts/lib/**'
              - 'scripts/go.mod'
              - 'scripts/go.sum'
              - 'conftest/plan/**'
              - 'conftest/hcl/**'
              - 'docs/setup/scripts/check-plan.*'

  tf-fmt-check:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: 対象のディレクトリの選び方と起動は scripts/tf-gates が持つ。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Terraform formatting
        run: make tf-fmt-check RUNNER_MODE=host

  tf-lint:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-lint が先に tool-cooldown-check を、TFLint の起動に tf-gates を、順序の検査と層の検査が infra-code-gate と tf-local を、順序の検査と
      # 層の検査と root の検査が hcl-input と hcl-tally を、層の検査と Policy Test が provider-schema を走らせ、6つとも scripts/ からビルドする。conftest: 順序の検査と
      # 層の検査と root の検査が使う。terraform: 層の検査が lock した AWS Provider の schema を取る（ADR-0102 決定18 の分類の網羅）。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:terraform-linters/tflint aqua:hashicorp/terraform aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN: `tflint --init` は ruleset を GitHub Releases API から取り、API は認証の無い呼び出しを
      # rate limit する。
      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make tf-lint RUNNER_MODE=host

      # Static Analysis の Conftest の側で、TFLint と同じ層なのでこの job に置く（ADR-0501 決定4）。
      - name: Check the resource order
        run: make -k resource-order-check RUNNER_MODE=host

      - name: Check the layer rules
        run: make -k layer-check RUNNER_MODE=host

      - name: Check the root composition and backend settings
        run: make -k root-check RUNNER_MODE=host

  tf-validate-test:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: 対象のディレクトリの選び方・起動・validate の判定は scripts/tf-gates が持つ。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -k: validate が落ちても test の結果を出す。どれが落ちても step は落ちる。
      # この step に secret を渡さない: init は PR の構成が解決した provider をそのまま走らせる。
      - name: Run terraform validate, terraform test and the bootstrap plan expectation check
        run: make -k tf-validate tf-test check-plan-expected RUNNER_MODE=host

  tf-policy:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # go: Policy Test の段（scripts/tf-policy・provider-schema・tf-local）を scripts/ からビルドする。conftest と terraform:
      # canary はホストの PATH のものを起動する。
      # canary を先に走らせる: 落ちえないゲートは reference の root について何も言わない。
      # この step に secret を渡さない: plan は資格情報なしに mock_provider で走る。
      - name: Run the Policy Test
        run: make tf-policy-canary tf-policy RUNNER_MODE=host

  tf-gates-test:
    needs: changes
    # Fail open — README.md の「必須検査はすべての Pull Request で報告される」.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: canary は scripts/tf-gates が、実物の terraform と AWS Provider で validate と判定の全体を走らせる。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the terraform validate canary
        run: make tf-validate-canary RUNNER_MODE=host

  # path で絞らない: README.md の「インフラ内コードの検出への依存」.
  infra-code-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: infra-code-gate と hcl-input と hcl-tally は scripts/ からビルドする。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:open-policy-agent/conftest go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect infrastructure code
        run: make -k infra-code-gate RUNNER_MODE=host

  # 規則は README.md の「plan の job」.
  plan-admin-identity:
    needs: infra-code-gate
    if: ${{ needs.infra-code-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: admin-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
            releases.hashicorp.com
            github-releases.githubusercontent.com
            sts.ap-northeast-1.amazonaws.com
            s3.ap-northeast-1.amazonaws.com
            *.s3.ap-northeast-1.amazonaws.com
            iam.amazonaws.com
            kms.ap-northeast-1.amazonaws.com
            organizations.us-east-1.amazonaws.com
            *.s3-control.ap-northeast-1.amazonaws.com

      # skip ではなく失敗にする（ADR-0602 決定14）。fork と Dependabot の run は secret を受けない。
      - name: Refuse untrusted Pull Requests
        id: refuse-untrusted
        env:
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.repository_id }}
          ACTOR: ${{ github.actor }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test "$HEAD_REPO_ID" = "$REPO_ID" || { echo "❌ fork からの Pull Request では plan の role を assume しません"; exit 1; }
          test "$ACTOR" != "dependabot[bot]" || { echo "❌ Dependabot の Pull Request では plan の role を assume しません"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "❌ environment admin-plan の secret AWS_ACCOUNT_ID がありません"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go: tf-local は scripts/ からビルドする。
      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:hashicorp/terraform aqua:open-policy-agent/conftest aqua:aws/aws-cli go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the plan role
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-aws-credentials CI_ENV=admin CI_ROLE=plan RUNNER_MODE=host

      - name: Confirm the apply-family roles refuse this job
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: make ci-assume-denied CI_ENV=admin RUNNER_MODE=host

      - name: Plan the identity root
        env:
          CI_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CI_PR: ${{ github.event.pull_request.number }}
        run: make ci-plan-admin-identity RUNNER_MODE=host

  # 規則は README.md の「plan の job」.
  plan-admin-workload:
    needs: infra-code-gate
    if: ${{ needs.infra-code-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: admin-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
