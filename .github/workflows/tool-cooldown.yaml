name: Tool Cooldown

# Every CLI tool version this repository pins is gated here. `mise.toml` is the sole declaration
# site, and a version published inside the window carries the same risk whichever tool it belongs to.
#
# Transitive dependencies are out of scope, for the same reason `go-cooldown` only gates direct
# requirements.
#
# The window has two tiers (14 days for a GitHub release, 7 for a package registry) and language
# runtimes are outside every window.
#
# Short names are resolved by asking `mise registry`, because mise decides which backend a name
# resolves to and a table kept here would drift silently the next time mise changes.

# Why the trigger condition lives in a job: README.md の「必須検査はすべての Pull Request で報告される」.
on:
  pull_request:
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            mise.run:443
            mise.en.dev:443
            aquaproj.github.io:443
            proxy.golang.org:443
            sum.golang.org:443
            index.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            golang.org:443
            nodejs.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
            api.npmjs.org:443
            api.osv.dev:443
            npm.jsr.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/go.mod
          cache: true

      # `mise registry` is what resolves a short name to its backend, so mise has to be present
      # even though no tool is installed here.
      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The default checkout is shallow, so the base commit is absent and `git show
      # <base>:mise.toml` fails. Fetching the base ref explicitly is what makes the diff
      # resolvable; without it the gate cannot tell an added pin from an existing one.

      - name: Resolve gate base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_REF}" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=200 origin "${BASE_REF}"
          echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"

      # The unauthenticated GitHub API allows 60 requests an hour per IP, which one run of this
      # check does not fit into. The summary body is written by the tool, which fences every
      # value it did not author itself: a tool key comes out of `mise.toml`, which the pull
      # request controls, and the step summary renders Markdown.
      - name: Check tool cooldown
        shell: bash
        env:
          GATE_BASE: ${{ steps.base.outputs.base }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${GATE_BASE}" ]; then
            make tool-cooldown-gate RUNNER_MODE=host \
              BASE="${GATE_BASE}" SUMMARY_OUT=tool-cooldown-summary.md \
              && status=0 || status=$?
          else
            make tool-cooldown-audit RUNNER_MODE=host \
              SUMMARY_OUT=tool-cooldown-summary.md \
              && status=0 || status=$?
          fi

          cat tool-cooldown-summary.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
