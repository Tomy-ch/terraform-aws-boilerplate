name: Tool Version Report

# `tool-cooldown` gates a declared version against the window; neither it nor anything else notices
# that upstream has published a newer one. Without this, the pins in `mise.toml` sit still until
# somebody remembers to check by hand. This reports so that remembering is not a person's job;
# it never applies an update.
#
# The report goes to an issue rather than a pull request because a notification carries no diff to
# maintain: it cannot conflict while it waits, and it closes itself once nothing is actionable.

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            registry.terraform.io

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: scripts/go.mod
          cache: true
          cache-dependency-path: scripts/go.sum

      # `mise registry` is what resolves a short name to its backend, so mise has to be present
      # even though no tool is installed here.
      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The unauthenticated GitHub API allows 60 requests an hour per IP, which one run of this
      # survey does not fit into.
      - name: Survey upstream versions
        id: survey
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # The report lists what could not be confirmed, so it reaches the summary even when the
          # survey fails on it.
          rc=0
          make tool-cooldown-outdated RUNNER_MODE=host OUT=tool-outdated.md || rc=$?
          if [ -f tool-outdated.md ]; then
            cat tool-outdated.md >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${rc}" -eq 0 ]; then
            echo "::error::the survey succeeded without writing tool-outdated.md"
            exit 1
          fi
          exit "${rc}"

      # This also runs after a survey that failed on some tools, so one unconfirmable tool does not
      # stop the notice for the others.
      - name: Decide the report state
        id: decide
        if: ${{ (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && !cancelled() && steps.survey.outputs.actionable != '' }}
        shell: bash
        env:
          ACTIONABLE: ${{ steps.survey.outputs.actionable }}
          FAILED: ${{ steps.survey.outputs.failed }}
        run: |
          set -euo pipefail
          # An empty count means the survey never wrote its output; closing the issue on it would
          # report "nothing to update" without having looked.
          if ! [[ "${ACTIONABLE}" =~ ^[0-9]+$ && "${FAILED}" =~ ^[0-9]+$ ]]; then
            echo "::error::survey did not report its counts (actionable=${ACTIONABLE}, failed=${FAILED})"
            exit 1
          fi
          # Nothing actionable is only "nothing to update" when every tool was confirmed.
          if [ "${ACTIONABLE}" -gt 0 ]; then
            state=open
          elif [ "${FAILED}" -gt 0 ]; then
            state=keep
          else
            state=close
          fi
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

      - name: Create or update the report issue
        if: ${{ (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && !cancelled() && steps.decide.outputs.state != '' }}
        uses: ./.github/actions/upsert-report-issue
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Tool Version Report: 窓を満たす更新があります'
          marker: '<!-- tool-outdated-report -->'
          state: ${{ steps.decide.outputs.state }}
          body-file: tool-outdated.md
          close-comment: 窓を満たす更新が無くなったので閉じます。
