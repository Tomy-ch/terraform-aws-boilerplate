name: Dependency Scan

on:
  push:
    branches: # branch-set: ruleset
      - 'admin'
      - 'security'
      - 'log-archive'
      - 'production'
      - 'staging'
      - 'develop'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      called:
        description: workflow_call で呼ばれたこと。呼ばれたときは、走らせるかどうかを呼んだ側が決めます。
        type: boolean
        default: true
    outputs:
      count:
        description: 修正版のある脆弱性の件数。
        value: ${{ jobs.trivy-fs.outputs.count }}
      detail:
        description: 検出の通知に載せる、脆弱性の識別子の一覧（Markdown）。
        value: ${{ jobs.trivy-fs.outputs.detail }}
      trivy-fs-status:
        description: job trivy-fs の status（success・failure・cancelled）。走らなければ空。
        value: ${{ jobs.trivy-fs.outputs.status }}
      trivy-license-status:
        description: job trivy-license の status（success・failure・cancelled）。走らなければ空。
        value: ${{ jobs.trivy-license.outputs.status }}

permissions:
  contents: read

concurrency:
  group: trivy-fs-${{ github.event_name }}-${{ inputs.called && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # job 単位に置く。workflow 単位の pull-requests: write は、コメントしない job にも及ぶ
    # （zizmor の excessive-permissions が広すぎると判定する）。
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    outputs:
      status: ${{ steps.status.outputs.status }}
      count: ${{ steps.summarize.outputs.count }}
      detail: ${{ steps.detail.outputs.markdown }}
    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy FS scan (JSON)
        run: make -s trivy-fs RUNNER_MODE=host TRIVY_FORMAT=json > trivy-fs.json
        shell: bash

      - name: Create Trivy summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          COUNT=$(jq '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | length
          ' trivy-fs.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Trivy FS: PASS (no vulnerabilities)" >> "$GITHUB_OUTPUT"
            echo "No vulnerabilities found." > trivy-fs-summary.md
            exit 0
          fi

          echo "title=## 🚨 Trivy FS: FOUND (${COUNT})" >> "$GITHUB_OUTPUT"

          jq -r '
            .Results
            | map(.Vulnerabilities // [])
            | flatten
            | sort_by({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,UNKNOWN:4}[.Severity] // 5)
            | .[]
            | "- [\(.Severity)] \(.PkgName // "unknown") `\(.InstalledVersion // "?")` → `\(.FixedVersion // "none")` (\(.VulnerabilityID))"
          ' trivy-fs.json > trivy-fs-summary.md

        shell: bash

      - name: Build detection detail
        id: detail
        if: ${{ steps.summarize.outputs.count != '0' }}
        uses: ./.github/actions/notify-detail
        with:
          summary-file: trivy-fs-summary.md

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-fs
          path: |
            trivy-fs.json
            trivy-fs-summary.md

      - name: Comment Trivy FS result on PR
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-fs-status -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Dependency Scan: CUT OFF (no result produced)' }}"
          body-file: trivy-fs-summary.md
          details-summary: '📄 Summary'

      - name: Trivy FS scan (SARIF)
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        run: make -s trivy-fs RUNNER_MODE=host TRIVY_FORMAT=sarif > trivy-fs.sarif
        shell: bash

      - name: Upload Trivy FS SARIF to code scanning
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # The workflow that calls this one on a schedule reads this to tell which job to report.
      - name: Report the job status
        id: status
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        env:
          STATUS: ${{ job.status }}
        run: echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  # License inventory shares this workflow's trigger because it asks about the very
  # same files, but it is a separate job so that its exit code, PR comment and
  # artifact never mix with the vulnerability verdict above.
  #
  # 報告のみで、SARIF も書かない。理由は README.md の「通知の起動条件」。
  trivy-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
            mirror.gcr.io
            ghcr.io
            pkg-containers.githubusercontent.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy license scan (JSON)
        run: make -s trivy-license RUNNER_MODE=host TRIVY_FORMAT=json > trivy-license.json
        shell: bash

      - name: Create license summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # License findings arrive in Results whose Class is "license". The same
          # targets also appear with Class "lang-pkgs" carrying no Licenses key, so
          # selecting on Class is what keeps the count honest. Results itself is
          # absent — not empty — when no dependency manifest is detected at all.
          LICENSES=$(jq '
            [(.Results // [])[] | select(.Class == "license") | .Licenses[]]
          ' trivy-license.json)

          TOTAL=$(printf '%s' "${LICENSES}" | jq 'length')

          # Trivy classifies every license into notice / unencumbered / permissive /
          # reciprocal / restricted / forbidden / unknown. The first two impose no
          # obligation worth a human's attention; the rest do.
          REVIEW=$(printf '%s' "${LICENSES}" | jq '
            map(select(.Category != "notice" and .Category != "unencumbered"))
          ')
          REVIEW_COUNT=$(printf '%s' "${REVIEW}" | jq 'length')

          BREAKDOWN=$(printf '%s' "${LICENSES}" | jq -r '
            group_by(.Category)
            | map("\(.[0].Category) \(length)")
            | join(" / ")
          ')

          # This scan has no pass / fail, so what decides whether it is worth a comment is the
          # same count the body is built around: an inventory where every license is notice /
          # unencumbered asks nothing of anyone, and the artifact holds the full list either way.
          echo "review=${REVIEW_COUNT}" >> "$GITHUB_OUTPUT"

          echo "title=## 📄 License Scan: ${TOTAL} licenses (${BREAKDOWN})" >> "$GITHUB_OUTPUT"

          {
            if [ "${REVIEW_COUNT}" -eq 0 ]; then
              echo "All licenses are notice / unencumbered; nothing needs review."
            else
              echo "Licenses outside notice / unencumbered (${REVIEW_COUNT}):"
              echo
              printf '%s' "${REVIEW}" | jq -r '
                sort_by(.Category, .Name)
                | .[]
                | "- [\(.Severity)] `\(.Name)` (\(.Category)) — \(.PkgName) in `\(.FilePath)`"
              '
            fi
          } > trivy-license-summary.md

          cat trivy-license-summary.md >> "${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Upload license report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-license
          path: |
            trivy-license.json
            trivy-license-summary.md

      - name: Comment license result on PR
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-license-status -->'
          status: "${{ steps.summarize.outputs.review == '0' && 'success' || 'review' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ License Scan: CUT OFF (no result produced)' }}"
          body-file: trivy-license-summary.md
          details-summary: '📄 Summary'

      # The workflow that calls this one on a schedule reads this to tell which job to report.
      - name: Report the job status
        id: status
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always()
        env:
          STATUS: ${{ job.status }}
        run: echo "status=$STATUS" >> "$GITHUB_OUTPUT"
