name: Trivy Secret Scan

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      called:
        description: workflow_call で呼ばれたこと。呼ばれたときは、走らせるかどうかを呼んだ側が決めます。
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: trivy-secret-${{ github.event_name }}-${{ inputs.called && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Trivy's secret scanner over the working tree, apart from secret-scan.yaml so its verdict,
  # comment and artifact never mix with the history scanners'.
  trivy-secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        id: harden-runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com
      - name: Prepare to retry hardening the runner
        if: steps.harden-runner.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30 && sudo apt-get update
      - name: Harden the runner (retry)
        id: harden-runner-retry
        if: steps.harden-runner.outcome != 'success'
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            api.github.com
            github.com
            codeload.github.com
            objects.githubusercontent.com
            raw.githubusercontent.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            productionresultssa30.blob.core.windows.net
            productionresultssa31.blob.core.windows.net
            productionresultssa32.blob.core.windows.net
            mise.jdx.dev
            mise-versions.jdx.dev
            mise.run
            mise.en.dev
            aquaproj.github.io
            proxy.golang.org
            sum.golang.org
            index.golang.org
            storage.googleapis.com
            dl.google.com
            go.dev
            golang.org
            nodejs.org
            registry.npmjs.org
            tuf-repo-cdn.sigstore.dev
            rekor.sigstore.dev
            fulcio.sigstore.dev
            awscli.amazonaws.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and required tools
        uses: ./.github/actions/setup-mise
        with:
          tools: go aqua:aquasecurity/trivy
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy secret scan (JSON)
        run: make -s trivy-secret RUNNER_MODE=host TRIVY_FORMAT=json > trivy-secret.json
        shell: bash

      - name: Create Trivy secret summary (Markdown)
        id: summarize
        run: |
          set -euo pipefail

          # Findings live under .Results[].Secrets; a file with none carries no Secrets
          # key, and Results itself is absent rather than empty when nothing was
          # scanned at all — hence the // [] defaults on both.
          COUNT=$(jq '
            [(.Results // [])[] | .Secrets // []]
            | flatten
            | length
          ' trivy-secret.json)

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "title=## ✅ Secret scan: PASS (trivy)" >> "$GITHUB_OUTPUT"
            echo "No secret detected." > trivy-secret-summary.md
            exit 0
          fi

          echo "title=## 🚨 Secret scan: FOUND (${COUNT}) (trivy)" >> "$GITHUB_OUTPUT"

          # Rule id, title, file and line only. Trivy redacts the matched value in its
          # own output, but a comment on a pull request is a public surface and there
          # is no version of it that should carry a candidate secret at all — not even
          # a redacted one, whose length and shape are themselves information.
          jq -r '
            (.Results // [])[]
            | .Target as $target
            | (.Secrets // [])[]
            | "- [\(.Severity)] `\($target):\(.StartLine)` \(.RuleID) — \(.Title)"
          ' trivy-secret.json > trivy-secret-summary.md
        shell: bash

      - name: Upload Trivy secret report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-secret
          path: |
            trivy-secret.json
            trivy-secret-summary.md

      - name: Comment Trivy secret result on PR
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- trivy-secret-result -->'
          status: "${{ steps.summarize.outputs.count == '0' && 'success' || 'findings' }}"
          title: "${{ steps.summarize.outputs.title || '## ⚠️ Secret scan (trivy): CUT OFF (no result produced)' }}"
          body-file: trivy-secret-summary.md
          details-summary: '📄 Summary'

      # No severity threshold: a secret has no "minor" band. Accepted detections are
      # pinned per path in .trivyignore.yaml, so the baseline this gates on is zero.
      - name: Fail if a secret was found
        if: (steps.harden-runner.outcome == 'success' || steps.harden-runner-retry.outcome == 'success') && always() && steps.summarize.outputs.count != '0'
        run: exit 1
