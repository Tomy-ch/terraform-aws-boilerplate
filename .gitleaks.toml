# gitleaks 設定
# https://github.com/gitleaks/gitleaks#configuration
#
# 秘密の検出の権威はこの層が持つ（ADR-0302 決定2）。Trivy の secret scanner は無効化してある。
# 抑止の条件は ADR-0501 決定13 に従う。
[extend]
useDefault = true

# actions-mise-pin-lint のフィクスチャが持つキャッシュキー（`mise-<版>-<digest の先頭8桁>`）。
#
# このツールが検査しているのは「キャッシュキーが版と digest の両方を含むこと」そのものなので、
# フィクスチャは実物と同じ形でなければならない。形を崩せば、検査していた対象が消える。
# `key:` という語と16進8桁の並びが generic-api-key の keyword + entropy 条件に当たる誤検知で、
# 値は実在しない。
#
# **外すのはこの形に当たる検出そのものであって、ファイルではない。** `paths` で外してはならない
# —— gitleaks の allowlist は `paths` と `regexes` を AND で評価せず、path が当たった時点で
# そのファイルの検出がすべて落ちる。`condition = "AND"` を書いても同じだった（8.30.1 で確認）。
# つまり path による除外は、同じファイルへ後から入った本物の秘密も一緒に見逃す。
#
# 撤回条件: キャッシュキーの形式が digest を含まなくなったとき、または actions-mise-pin-lint が
# 無くなったとき。
[allowlist]
description = "actions-mise-pin-lint のフィクスチャ内のキャッシュキー（実在しない合成値）"
regexTarget = "match"
regexes = ['mise-\d+\.\d+\.\d+-[0-9a-f]{8}']
