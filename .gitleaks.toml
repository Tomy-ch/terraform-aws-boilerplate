# gitleaks 設定。https://github.com/gitleaks/gitleaks#configuration
#
# 抑止ポリシー（.gitleaksignore / .trivyignore.yaml と共通）
# - ルールの一括無効化は禁止。抑止はファイル単位 or フィンガープリント単位に限定する
# - エントリには必ず「なぜ秘密でないか」を書く。理由を書けないものは抑止しない
# - 条件が変われば（対象が消えた / 生成物でなくなった）エントリを削除する。恒久 allowlist にしない
#
# 本ファイルは検知ルールの土台（既定ルールセットの採用）と、機械生成物のパス除外を担う。
# 個別の検出結果をピンポイントで許容する場合は .gitleaksignore（フィンガープリント単位）を使う。

[extend]
useDefault = true

# 既定ルールセットには gitleaks 本体が持つ global allowlist が同梱される。
# 各種 lockfile や .svg など、いくつかの path が無条件に走査対象外になり、
# これは本ファイルからは打ち消せない（上記の抑止ポリシーが及ばない範囲）。
# 打ち消すには useDefault を捨てて全ルールを自前で持つ必要があり、既定ルールの更新追随を失う。
# 追随を優先して useDefault を採り、除外範囲は把握したうえで受け入れる。
#
# allowlist は現時点で空。誤検知が実際に出た時点で、上記ポリシーに沿って理由付きで追加する。
