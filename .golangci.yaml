# 運用機構（scripts/）の Go に対する lint。
#
# 対象はこのリポジトリが自ら書くツールだけである。配送物は Terraform の構成であって Go ではない
# （ADR-0020 決定3）。したがって、アプリケーションのレイヤー境界を前提とする規則は置かない。
#
# 既定で有効な集合に、**ゲートが静かに壊れる形**を捕まえる規則を足す。ゲートは
# 「何も検査せず緑を報告する」方向へ壊れるため、戻り値の捨て置きと到達不能な分岐が効く。
version: "2"

linters:
  default: none
  enable:
    # 既定で有効
    - errcheck # 戻り値のエラーを捨てていないか
    - govet
    - ineffassign # 代入した値が使われないまま上書きされていないか
    - staticcheck
    - unused

    # 追加
    - bodyclose # HTTP レスポンスの Body を閉じているか（registry / GitHub API を引くため）
    - contextcheck # context の伝播が途切れていないか
    - copyloopvar
    - errorlint # エラーの比較が errors.Is / As を通っているか
    - gocritic
    - gosec # 外部コマンドの起動とファイル操作を多く含むため
    - misspell
    - nilerr # エラーが非 nil なのに nil を返していないか
    - noctx
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    staticcheck:
      checks:
        - all
    errcheck:
      # 出力先への書き込みは、失敗しても報告する先が同じ出力なので握る。
      # ここに載せるのは「握って構わない」ではなく「握るしかない」ものに限る。
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

  exclusions:
    rules:
      # テストは長い行と重複を許す。フィクスチャの可読性を規則より優先する。
      - path: (.+)_test\.go
        linters:
          - gosec
          - unparam
          - prealloc

run:
  # 固定の timeout を置かない。予算は呼び出し元（make / CI の timeout-minutes）が持つ。
  timeout: "0s"
  issues-exit-code: 1
  tests: true
  relative-path-mode: wd

formatters:
  enable:
    - gofmt
    - goimports
