  # DL3008 / DL3018: OS パッケージの版を固定せよ。
  #
  # 固定しない。**ベースイメージを digest で固定している**ため（ADR-0022 決定10）、
  # 同じ digest から解決される版は同じ配布元の同じ状態を引く。ここで版を書き足すと、
  # 上流のリポジトリが当該版を落とした時点でビルドが壊れる —— 得るものは digest 固定で
  # 既に得ており、失うのはビルドの継続性だけである。
  #
  # 撤回条件: ベースイメージの digest 固定をやめたとき。
