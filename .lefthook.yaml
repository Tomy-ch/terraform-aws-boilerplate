# ローカルの git hook。**速いフィードバックのために置き、CI の代替としない**（ADR-0013 決定26）。
#
# hook は `--no-verify` で迂回される前提で設計する。hook でのみ成立する検査を作らない。
# 権威は CI であり、ここに在るのは「壊れた状態を CI へ到達させない第一段」に過ぎない。
#
# コマンドは素で書く。検査の定義は `.makefiles/` が1箇所で持ち、ここはその起動だけを持つ
# （ADR-0023 決定8）。実行環境の切り替えは make 側の RUNNER_MODE が受ける。
#
# 導入: `lefthook install` で .git/hooks に配置する。

pre-commit:
  parallel: true
  commands:
    # workflow 定義の検査群。actionlint / composite の run: / シェル / required check の整合 /
    # PR コメントの secret とフェンス / mise 導入 action の三点一致を1本で回す。
    actions-lint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - ".github/settings/branch-protection.json"
        - "scripts/**/*.go"
      run: make actions-lint

    # Markdown の体裁。このリポジトリの主要な成果物が Markdown であるため、対象が無いコミットは
    # まれだが、glob で発火を絞る。
    md-lint:
      glob: "**/*.md"
      run: make md-lint

    # Dockerfile の検査。
    docker-lint:
      glob: "docker/**/Dockerfile"
      run: make docker-lint

    # allowed-endpoints が SSOT（.github/egress.toml）通りか。
    # apply を忘れた状態を commit させない。
    egress-check:
      glob:
        - ".github/egress.toml"
        - ".github/workflows/*.{yml,yaml}"
      run: make egress-check

    # uses: と image: の固定。lockfile と実ファイルの drift、および参照されなくなった
    # lockfile のエントリ（orphan）を落とす。
    pin-actions-check:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - ".github/actions-pin.toml"
      run: make pin-actions-check
    pin-images-check:
      glob:
        - "docker/**/Dockerfile"
        - "docker-compose.yaml"
        - "docker/images-pin.toml"
      run: make pin-images-check

    # 運用機構の整形とテスト。ゲートは「検査をやめると緑になる」ため、テストを hook から外さない。
    go-fmt-check:
      glob: "scripts/**/*.go"
      run: make go-fmt-check
    go-test:
      glob:
        - "scripts/**/*.go"
        - "scripts/go.mod"
        - "scripts/go.sum"
      run: make go-test

commit-msg:
  commands:
    # 規約の正本は ADR-0022。機械が課すのは type の enum と type / subject の空チェックだけで、
    # 文体と長さはレビューで見る。
    #
    # **hook だけでは何も保証しない。** `--no-verify` で日常的に飛ぶうえ、自動化が作る commit は
    # ローカル hook を走らせない。本体は CI 側の範囲検査（make commitlint-range）である。
    commitlint:
      run: cat {1} | docker compose run --rm -T node_tool_runner commitlint

pre-push:
  parallel: true
  commands:
    # push 予定の commit 範囲に秘密が無いこと。検出時は通さない（ADR-0019 決定4）。
    #
    # 混入を検出した場合の第一手は当該資格情報の**失効**であり、履歴からの除去ではない。
    # push 済みであれば、履歴を書き換えても漏洩の事実は取り消せない。
    secret-scan:
      run: make secret-scan
