# markdownlint-cli2 の設定（ルールと実行設定を 1 ファイルに集約）。
# ルール本体は config:、走査除外は ignores: に置く。

config:
  MD013: false # 行長は制限しない
  MD033: false # インライン HTML を許可
  MD041: false # 先頭行が H1 でなくてよい

  # MD029（番号付きリストの接頭辞）を無効にする。
  #
  # ADR は決定を**節をまたいで連番**で振る。「決定20」という参照が一意に解決するためであり、
  # この番号は見た目ではなく**識別子**である（ADR-0001 決定9 が、参照には番号と題の両方を
  # 書くよう求めている）。
  #
  # Markdown のリスト意味論はこれを表現できない。見出しで区切られた各リストは独立した
  # リストとして扱われ、5 番から始まる節は「1 で始めよ」と報告される。規則に合わせるには
  # 連番を捨てるほかなく、そのとき失われるのは**決定を指す手段**である。
  #
  # 撤回条件: 決定を番号で参照するのをやめたとき。
  MD029: false

  # 表の区切りを見出しと揃えよ、という規則。
  #
  # 日本語と英数字が混在する表では、桁を揃えても**表示上は揃わない**（文字幅が異なる）。
  # 揃えても得るものが無く、列を1つ足すたびに全行の書き直しが要る。
  #
  # 撤回条件: 表の内容が単一の文字幅に収まるようになったとき。
  MD060: false

# 除外はここに集約する。CLI 実行時のグロブに書くとエディタ拡張が知り得ず、
# コマンドは通るのにエディタだけ警告する状態になる。
ignores:
  # 依存物・生成物・作業用。リポジトリが体裁を管理する対象ではない。
  - "**/node_modules/**"
  - ".git/**"
  - "tmp/**"
  # Markdown ではないのに Markdown と誤認され誤検知されるファイル。
  # gitleaks の無視リスト（# はコメント。見出し扱いで MD022 等を誤検知）。
  - ".gitleaksignore"
  # 拡張子なしのプレーンテキスト LICENSE（MD041/MD022 等を誤検知）。
  - "LICENSE"
  # レビュワー割り当て定義（# はコメント、パターンの * を強調記法と誤検知）。
  - ".github/CODEOWNERS"
