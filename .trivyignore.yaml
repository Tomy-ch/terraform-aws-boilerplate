# Trivy が無視する検出の一覧。https://trivy.dev/latest/docs/configuration/filtering/
#
# 抑止ポリシー（.gitleaks.toml / .hadolint.yaml と共通）
# - スキャナやチェックの一括無効化は禁止。抑止は検出 ID と対象パスの単位に限る
# - 各エントリに statement で「なぜ許容できるか」を書く。理由を書けないものは抑止せず直す
# - 条件が変われば（対象が消えた / 前提が変わった）エントリを削除する。恒久 allowlist にしない

vulnerabilities: []

misconfigurations:
  - id: DS-0026
    paths:
      - "docker/tools/Dockerfile"
    statement: |
      HEALTHCHECK を置かない。このイメージは make から `docker compose run --rm` で起動して
      終了する使い捨てであり、常駐しない。観測すべき健全性の状態が存在しない。
      撤回条件: このイメージを常駐させる用途が生じたとき。
