# Trivy が無視する検出の一覧。https://trivy.dev/latest/docs/configuration/filtering/
#
# 抑止の条件は ADR-0501 決定13 に従う（.gitleaks.toml / .hadolint.yaml と共通）。

vulnerabilities: []

misconfigurations:
  - id: DS-0026
    paths:
      - "docker/tools/Dockerfile"
    statement: |
      HEALTHCHECK を置かない。このイメージは make から `docker compose run --rm` で起動して
      終了する使い捨てであり、常駐しない。観測すべき健全性の状態が存在しない。
      撤回条件: このイメージを常駐させる用途が生じたとき。
  - id: AWS-0132
    paths:
      - "modules/s3/encryption.tf"
    statement: |
      理由の正本は usecases/state-backend/docs/adr/0101-sse-s3-until-cmk.md（Checkov の CKV_AWS_145 の抑止と同じ）。
      bootstrap の段1・段2 の state Bucket は SSE-S3 で暗号化する（docs/v1.0-plan/scope.md 第10.3節、
      ADR-0602 決定5・8）。CMK は段5 で作るので、段2 で import する構成は KMS を持てない。
      撤回条件: #19 の段5 で modules/s3 を SSE-KMS に切り替えたとき。それより前に state-backend
      以外の usecase がこの module を使う場合は、その変更の中でこの抑止を見直す。
