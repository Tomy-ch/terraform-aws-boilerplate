# 道具の実行形態。ここが持つのは起動の仕方と、上流のイメージで実行する道具
# （checkov / kics / semgrep）の tag だけである。それ以外の版の出所は mise.toml。
#
# **これは配送物ではない。** このリポジトリが配送するのは Terraform の構成であって、
# コンテナではない。ここに在るのは、検査の道具を利用者の環境に依らず同じ依存で走らせる
# ための入れ物だけである。
#
# terraform 本体はここに居ない（ADR-0503 決定5、docker/tools/README.md）。

services:
  # 運用機構（scripts/）と、workflow・シェル・Terraform・コンテナ定義の検査（ADR-0503 決定6）。
  go_tool_runner:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go_tools
      secrets:
        - github_token
    # 生成物をホストの所有者で書き出す。root で書くと、道具が直した行を直した本人が
    # 消せない状態がリポジトリに残る。
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      # 非 root で走るため、道具が書ける HOME を与える。
      HOME: /tmp
    entrypoint: ""
    init: true

  # npm エコシステムの道具: markdownlint-cli2 / commitlint
  node_tool_runner:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node_tools
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      HOME: /tmp
    entrypoint: ""
    init: true

  # 上流がイメージとして配布する Security の道具（ADR-0503 決定4・7・10）。digest は
  # make pin-images-apply が docker/images-pin.toml から書く。起動は .makefiles/runner.mk の
  # IMAGE_RUN が `docker compose config --images` で読み、mount を使わずに docker create / cp / start
  # で行う。`docker compose run` では起動しない。
  checkov_runner:
    image: bridgecrew/checkov:3.3.26@sha256:8e63f217cb084f1c1a067326a9cf6e37d54bdc82e5822210d50ca4e2f647dd93

  kics_runner:
    image: checkmarx/kics:v2.1.20@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602

  semgrep_runner:
    image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3

secrets:
  # mise のツール解決を認証付きにするビルド時トークン。未認証の GitHub API は
  # 60 req/hour・IP 単位で、イメージの install 群を賄えず 403 になる。
  # build 引数と違い、イメージの履歴に残らない。
  github_token:
    environment: GITHUB_TOKEN
