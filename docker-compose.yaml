# 道具の実行形態。ここが持つのは起動の仕方と、上流のイメージで実行する道具
# （checkov / kics / semgrep）の tag だけである。それ以外の版の出所は mise.toml。
#
# **これは配送物ではない。** 理由は docker/tools/README.md。
#
# terraform 本体はここに居ない（ADR-0503 決定5、docker/tools/README.md）。

services:
  # 運用機構（scripts/）と、workflow・シェル・Terraform・コンテナ定義の検査（ADR-0503 決定6）。
  go_tool_runner:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: go_tools
      secrets:
        - github_token
    # 生成物をホストの所有者で書き出す。root で書くと、道具が直した行を直した本人が
    # 消せない状態がリポジトリに残る。
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    volumes:
      - .:/app
      # git worktree の .git は、ホストの絶対パスにある共通の git ディレクトリを指す。同じパスに
      # 読み取り専用で置かないと、コンテナの中の git が履歴にも追跡ファイルにも届かない。
      - ${RUNNER_GIT_COMMON_DIR:-./.git}:${RUNNER_GIT_COMMON_DIR:-/tmp/git-common}:ro
    working_dir: /app
    environment:
      # 非 root で走るため、道具が書ける HOME を与える。
      HOME: /tmp
    entrypoint: ""
    init: true

  node_tool_runner:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
      target: node_tools
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      HOME: /tmp
    entrypoint: ""
    init: true

  # 上流がイメージとして配布する Security の道具（ADR-0503 決定4・7・10）。digest は
  # make pin-images-apply が docker/images-pin.toml から書く。起動は scripts/iac-scan が
  # 行う。ここの service を `docker compose run` では起動しない。
  checkov_runner:
    image: bridgecrew/checkov:3.4.5@sha256:122602cf32cc72286155d39f1f234b7b594818f7b8d7fdf490701620e521368b

  kics_runner:
    image: checkmarx/kics:v2.2.1@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757

  semgrep_runner:
    image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d

secrets:
  # mise のツール解決を認証付きにするビルド時トークン。未認証の GitHub API は
  # 60 req/hour・IP 単位で、イメージの install 群を賄えず 403 になる。
  # build 引数と違い、イメージの履歴に残らない。
  github_token:
    environment: GITHUB_TOKEN
