# ツールチェーンの pin（ADR-0501 決定19）。**ここが持つのは版の宣言だけ**である。
#
# **3つの実行経路がすべてこのファイルを読む。** 版を並べ直した設定を、イメージ側にも
# workflow 側にも置かない。環境差分を最小にするための要点はここにある。
#
#   ローカル  mise がホストへ導入したものを直接実行する
#   CI        主要ランタイムは各 setup アクションが用意し、残りをこのファイルから読み込む
#   コンテナ  このファイルを読んでイメージを組み立てる
#
# ベースイメージが提供するランタイムの版がこのファイルの宣言とずれた場合、イメージの
# ビルドが落ちる。3経路の版が黙って割れるのを、ビルド時に止める。
#
# backend（`aqua:` / `npm:` 等）は、短い名前で一意に解決できないものだけ明示する。レジストリ上で
# 複数 backend を持つツールは、既定 backend が差し替わると取得元が黙って変わる。
#
# **未使用の道具を pin だけ置かない**（ADR-0501 決定33）。ここに在るものは、`.makefiles/` か
# `.github/workflows/` か `docker/tools/Dockerfile` のいずれかが実際に呼ぶ。AWS CLI だけが例外で、
# 呼ぶのは ADR-0602 決定4 の bootstrap の手順である —— **その手順書はまだ無い。**
min_version = "2026.6.0"

[tools]

# ==============================================================================
# 言語ランタイム
# ==============================================================================

# 運用機構の実装言語（ADR-0702 決定6）。go.mod の go ディレクティブ、および
# docker/tools/Dockerfile のベースイメージと揃える（ずれたらイメージのビルドが落ちる）。
go = "1.27.1"

# npm エコシステムの道具のためのランタイム。同じくベースイメージと揃える。
node = "24.21.0"


# ==============================================================================
# 実行エンジンと、ローカルの git hook
# ==============================================================================

# 実行エンジン（ADR-0502 決定1）。OpenTofu を採らない理由は同 ADR 決定3。
# module が宣言する required_version は、使用する機能から導かれる下限であって
# この pin と同じ値ではない（同 決定2）。
"aqua:hashicorp/terraform" = "1.16.2"

# Static Analysis の権威（ADR-0501 決定4）。`terraform validate` の代替ではなく補完（同 決定5）。
# AWS ルールセットは tflint 自身のプラグイン機構が取るため、版の固定は .tflint.hcl が持つ
# —— そのファイルはまだ無い（AGENTS.md「現在の配線状態」）。
"aqua:terraform-linters/tflint" = "0.64.0"

# Security の権威（ADR-0501 決定4・決定6）。secret scanner は無効化し misconfiguration に限定する
# （ADR-0302 決定2）。Terraform の IaC 走査もここが担う。
"aqua:aquasecurity/trivy" = "0.74.0"

# Secret Scan の権威（ADR-0302 決定1）。走査対象は commit と履歴であり、作業ツリーのファイルではない。
"aqua:gitleaks/gitleaks" = "8.30.1"

# bootstrap の段1 が state backend の実体を作る道具（ADR-0602 決定4）。人が扱う AWS 資格情報を
# コンテナ境界越しに渡さないため、ホストで実行しツールランナーのイメージへは入れない。
# ADR-0503 決定5 は terraform を名指した決定であり、この道具には及んでいない。
# 配布物は GitHub ではなく awscli.amazonaws.com から来る（aqua の定義が `type: http`）。
"aqua:aws/aws-cli" = "2.36.40"

# ==============================================================================
# 検査の道具
# ==============================================================================

# template injection の検出。shellcheck 系には構造的に見えない —— ${{ }} はシェルがパースする
# 前に置換されるため、補間された式は文字列ではなくコードになる。だから lint に束ねず横に並べる。
"aqua:zizmorcore/zizmor" = "1.30.0"

# workflow 定義の構文と式、run: のシェルを検査する。走査が及ぶのは .github/workflows だけで、
# composite action の中は scripts/actions-shellcheck が埋める。
actionlint = "1.7.12"
# actionlint が run: を検査するために PATH 上で参照する（同梱ではなく別バイナリ）。
shellcheck = "0.11.0"

# ツールランナーの Dockerfile を検査する。
hadolint = "2.15.1"

# 運用機構（scripts/）の Go を検査する。
golangci-lint = "2.13.2"

# ローカルの git hook。速いフィードバックのために置き、CI の代替としない（ADR-0501 決定26）。
lefthook = "2.1.12"

# --- npm エコシステム（ADR-0503 決定14） ---

# Markdown の体裁。このリポジトリの主要な成果物が Markdown である以上、既製品が在るなら
# 自前で書かない（ADR-0501 決定3 の第1条件）。
"npm:markdownlint-cli2" = "0.23.2"

# commit message の検査。規約の正本は commitlint.config.js。課すのは type の enum と type / subject の空チェックだけで、
# 一般的な規約集の設定を継承しない（同 決定4）。
"npm:@commitlint/cli" = "21.2.2"
