# SonarCloud の走査の設定（.github/workflows/sonarcloud.yaml）。
sonar.projectKey=Tomy-ch_terraform-aws-boilerplate
sonar.organization=tomy-ch
sonar.projectName=terraform-aws-boilerplate

sonar.sources=.
sonar.exclusions=tmp/**,**/.terraform/**,docs/**,**/*.md,**/*_test.go,**/*.tftest.hcl
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.tftest.hcl
# カバレッジは go-test（octocov と cover-gate）が持つ。
sonar.coverage.exclusions=**/*

# git をパス名で起動する箇所。絶対パスへ書き換えると mise・Docker・macOS・CI ランナーで解決先が
# 違うため、環境ごとに壊れるほうへ倒れる。当たるのは運用機構（scripts/）だけで、いずれも
# リポジトリの作業ツリー上でしか動かず、PATH は起動した開発者か runner のものである。
# scripts/ の外で外部コマンドを起動する箇所が増えれば、別のパスとして出る。
sonar.issue.ignore.multicriteria=s4036scripts,s8431docker,s6249s3,s6249planoutput,s6258s3,s6258planoutput
sonar.issue.ignore.multicriteria.s4036scripts.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.s4036scripts.resourceKey=scripts/**

# FROM はタグ（版の正本。mise.toml との一致を make versions-check が検査する）と digest
# （中身の固定。images-pin が冷却期間付きで更新する）の両方を持つ。片方にすると、どちらかの
# 検査が成り立たなくなる。撤回: 版の正本をタグ以外へ移したとき。
sonar.issue.ignore.multicriteria.s8431docker.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.s8431docker.resourceKey=docker/**/Dockerfile

# TLS でない要求の拒否は、Bucket と別の resource の aws_s3_bucket_policy が持つ（各 policy.tf。各
# tests/policy.tftest.hcl が文書を固定する）。この規則は別の resource の policy を Bucket に結び付けない。
# 撤回: 規則が aws_s3_bucket_policy を読むようになったとき。
sonar.issue.ignore.multicriteria.s6249s3.ruleKey=terraform:S6249
sonar.issue.ignore.multicriteria.s6249s3.resourceKey=modules/s3/**
sonar.issue.ignore.multicriteria.s6249planoutput.ruleKey=terraform:S6249
sonar.issue.ignore.multicriteria.s6249planoutput.resourceKey=usecases/state-backend/internal/plan-output/**

# S3 サーバーアクセスログは aws_s3_bucket_logging ではなく CloudWatch Logs への配送で取る
# （docs/v1.0-plan/scope.md 第9.3節、state-backend/ADR-0201 (plan-output-bucket) 決定6）。この規則は
# aws_s3_bucket_logging しか見ない。撤回: アクセスログを aws_s3_bucket_logging で取るとき。
sonar.issue.ignore.multicriteria.s6258s3.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.s6258s3.resourceKey=modules/s3/**
sonar.issue.ignore.multicriteria.s6258planoutput.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.s6258planoutput.resourceKey=usecases/state-backend/internal/plan-output/**
