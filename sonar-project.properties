# SonarCloud の走査の設定（.github/workflows/sonarcloud.yaml）。
sonar.projectKey=Tomy-ch_terraform-aws-boilerplate
sonar.organization=tomy-ch
sonar.projectName=terraform-aws-boilerplate

sonar.sources=.
sonar.exclusions=tmp/**,**/.terraform/**,docs/**,**/*.md,**/*_test.go,**/*.tftest.hcl
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.tftest.hcl
# カバレッジは go-test（octocov と cover-gate）が持つ。
sonar.coverage.exclusions=**/*

# git をパス名で起動する箇所。絶対パスへ書き換えると mise・Docker・macOS・CI ランナーで解決先が
# 違うため、環境ごとに壊れるほうへ倒れる。当たるのは運用機構（scripts/）だけで、いずれも
# リポジトリの作業ツリー上でしか動かず、PATH は起動した開発者か runner のものである。
# scripts/ の外で外部コマンドを起動する箇所が増えれば、別のパスとして出る。
sonar.issue.ignore.multicriteria=s4036scripts
sonar.issue.ignore.multicriteria.s4036scripts.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.s4036scripts.resourceKey=scripts/**
